function LessonRunner({ level, levelId, onBack, onComplete, progressActions }) {
  // ─── Teacher mode (only if level.teacherScript exists) ───
  const hasTeacher = !!level.teacherScript;
  // ─── Announce active level to parent (for global AI assistant context) ───
  useEffect(() => {
    try {
      window.parent && window.parent.postMessage({
        source: "subjunctive-lab",
        type: "state",
        payload: { levelId: levelId, levelTitle: (level && level.title) || ("Level " + levelId) },
      }, "*");
    } catch (e) { /* noop */ }
    return () => {
      try {
        window.parent && window.parent.postMessage({
          source: "subjunctive-lab", type: "state", payload: { levelId: null },
        }, "*");
      } catch (e) { /* noop */ }
    };
  }, [levelId]);
  // teacherStage: 'intro' (show modal) | 'lesson' (playing) | 'done' (finished/skipped)
  const [teacherStage, setTeacherStage] = useState(hasTeacher ? "intro" : "done");
  const [teacherSkipped, setTeacherSkipped] = useState(false);
  const [transformErrors, setTransformErrors] = useState(0);
  const [showRebound, setShowRebound] = useState(false);
  const [reboundShown, setReboundShown] = useState(false); // prevent showing twice

  const [phase, setPhase] = useState(0);  // 0: rule  1: reflex  2: transform  3: exam  4: done
  const [reflexIdx, setReflexIdx] = useState(0);
  const [reflexRevealed, setReflexRevealed] = useState(false);
  const [halfwayDismissed, setHalfwayDismissed] = useState(false);
  const [transformIdx, setTransformIdx] = useState(0);
  const [transformInput, setTransformInput] = useState("");
  const [transformFb, setTransformFb] = useState(null);
  const [transformReveal, setTransformReveal] = useState(false);
  const [tilePool, setTilePool] = useState([]);  // [{id, word}]
  const [tilePicked, setTilePicked] = useState([]);  // [tileId,...]

  const [examIdx, setExamIdx] = useState(0);
  const [examPicked, setExamPicked] = useState(null);
  const [examRevealed, setExamRevealed] = useState(false);
  const [examScore, setExamScore] = useState(0);

  const transformDone = transformIdx >= level.fillTasks.length;
  const lvlQuestions = QUESTION_BANK.filter(q => q.lvl === parseInt(levelId, 10));
  const examDone = examIdx >= lvlQuestions.length;

  // ─── Correction tasks state (P1 #1 改错题型) ───
  const correctionList = level.correctionTasks || [];
  const [correctionIdx, setCorrectionIdx] = useState(0);
  const [correctionInput, setCorrectionInput] = useState("");
  const [correctionFb, setCorrectionFb] = useState(null);
  const [correctionRevealed, setCorrectionRevealed] = useState(false);
  const correctionDone = correctionList.length === 0 || correctionIdx >= correctionList.length;
  const ct = correctionList[correctionIdx];

  const checkCorrection = () => {
    const norm = correctionInput.trim().toLowerCase().replace(/\s+/g, " ").replace(/[.,!?;:]+$/, "");
    if (!norm || !ct) return;
    const targetNorm = ct.model.toLowerCase().replace(/[.,!?;:]+$/, "").replace(/\s+/g, " ");
    if (ct.pattern.test(norm) || norm === targetNorm) {
      setCorrectionFb({ kind: "correct", msg: "**完全正确！** 你找到了所有错误。", target: ct.model });
      if (progressActions) progressActions.awardFillCorrect();
    } else {
      setCorrectionFb({ kind: "wrong", msg: "**没有完全改对**——参考下方答案，对照错误清单看清楚每个错的地方。", target: ct.model });
    }
  };

  const advanceCorrection = () => {
    setCorrectionIdx(i => i + 1);
    setCorrectionInput("");
    setCorrectionFb(null);
    setCorrectionRevealed(false);
  };

  const normalizeTransformAnswer = (value) => String(value || "")
    .toLowerCase()
    .replace(/[’]/g, "'")
    .replace(/\s+([.,!?;:])/g, "$1")
    .replace(/[.,!?;:]+$/g, "")
    .replace(/\s+/g, " ")
    .trim();

  // Transform check
  const tt = level.fillTasks[transformIdx] || level.fillTasks[0];
  const checkTransform = (overrideInput) => {
    const raw = (overrideInput !== undefined ? overrideInput : transformInput) || "";
    const norm = normalizeTransformAnswer(raw);
    if (!norm) return;
    const targetNorm = normalizeTransformAnswer(tt.model);
    // Layer 1 — perfect match against the model answer's pattern
    tt.pattern.lastIndex = 0;
    if (tt.pattern.test(norm) || norm === targetNorm) {
      setTransformFb({ kind: "correct", msg: "**完全正确！** 你抓住了核心结构。", target: tt.model });
      if (progressActions) progressActions.awardFillCorrect();
      return;
    }
    // Layer 2 — known specific errors (priority: catch typical pitfalls first)
    if (tt.errors) {
      for (const err of tt.errors) {
        if (err.match.test(norm)) {
          setTransformErrors(e => e + 1);
          setTransformFb({ kind: "specific", msg: err.msg, target: tt.model });
          setTransformReveal(true);
          return;
        }
      }
    }
    // Layer 3 — grammar OK but not the most natural phrasing.
    // Critical: if a student got the subjunctive structure right (had + done → would + V now),
    // they should not be punished for choosing a less idiomatic verb. Reward grammar; nudge naturalness.
    if (tt.acceptPattern) tt.acceptPattern.lastIndex = 0;
    if (tt.acceptPattern && tt.acceptPattern.test(norm)) {
      const grammarLine = "**✓ 语法完全正确**——你成功用了" + (tt.grammarLabel || "虚拟语气结构") + "。";
      const naturalLine = tt.naturalNote
        ? " 💎 **更地道的说法**：" + tt.naturalNote
        : (tt.acceptMsg ? " " + tt.acceptMsg : " 💎 下方有一个 native speaker 更常用的表达，作为参考。");
      setTransformFb({ kind: "acceptable", msg: grammarLine + naturalLine, target: tt.model });
      if (progressActions) progressActions.awardFillCorrect();
      return;
    }
    // Layer 4 — real failure
    setTransformErrors(e => e + 1);
    setTransformFb({ kind: "wrong", msg: "**和标准答案不一样**——参考下方答案，重点看动词形式。", target: tt.model });
    setTransformReveal(true);
  };

  const advanceTransform = () => {
    setTransformIdx(i => i + 1);
    setTransformInput("");
    setTransformFb(null);
    setTransformReveal(false);
    setTilePicked([]);
  };

  // ─── 选词拼句：当题目切换时，重新生成单词磁贴 ───
  useEffect(() => {
    if (!tt || !tt.model) return;
    const correctTokens = tt.model
      .replace(/([.,!?;:])/g, " $1")
      .split(/\s+/)
      .filter(Boolean);
    const lower = new Set(correctTokens.map(t => t.toLowerCase()));
    const distractorPool = ["was", "am", "will", "did", "have", "do", "would", "had", "be", "is", "are", "can", "could"];
    const distractors = distractorPool.filter(w => !lower.has(w)).slice(0, 3);
    const tiles = [...correctTokens, ...distractors].map((w, i) => ({ id: i, word: w }));
    // Fisher-Yates 洗牌
    for (let i = tiles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
    setTilePool(tiles);
    setTilePicked([]);
    setTransformInput("");
    setTransformFb(null);
    setTransformReveal(false);
  }, [transformIdx, tt && tt.model]);

  const assemblePicked = () => {
    const words = tilePicked.map(id => {
      const t = tilePool.find(x => x.id === id);
      return t ? t.word : "";
    });
    return words.join(" ").replace(/\s+([.,!?;:])/g, "$1");
  };
  const onPickTile = (id) => {
    if (transformFb && transformFb.kind === "correct") return;
    if (tilePicked.includes(id)) return;
    setTilePicked(p => [...p, id]);
    if (transformFb) setTransformFb(null);  // 重新选词时清掉旧反馈
  };
  const onUnpickTile = (id) => {
    if (transformFb && transformFb.kind === "correct") return;
    setTilePicked(p => p.filter(x => x !== id));
    if (transformFb) setTransformFb(null);
  };
  const onClearPicked = () => {
    if (transformFb && transformFb.kind === "correct") return;
    setTilePicked([]);
    setTransformFb(null);
  };
  const onCheckTiles = () => {
    const sentence = assemblePicked();
    if (!sentence) return;
    setTransformInput(sentence);
    checkTransform(sentence);
  };

  const handleTransformKey = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (transformFb) advanceTransform();
      else checkTransform();
    }
  };

  // Exam handler
  const eq = lvlQuestions[examIdx];
  const submitExam = () => {
    if (!examPicked) return;
    setExamRevealed(true);
    if (examPicked.correct) {
      setExamScore(s => s + 1);
      if (progressActions) progressActions.recordCorrect();
    } else if (progressActions) {
      progressActions.recordMistake(levelId, {
        qId: eq.id, picked: examPicked.id,
        correctAnswer: eq.opts.find(o => o.correct).id,
        stem: eq.stem, point: eq.point,
      });
    }
  };
  const advanceExam = () => {
    setExamIdx(i => i + 1);
    setExamPicked(null);
    setExamRevealed(false);
  };

  // Keyboard shortcuts across all phases (rule / reflex / exam)
  // Phase 2 (transform) handles Enter inside its textarea separately.
  useEffect(() => {
    const handler = (e) => {
      const target = e.target;
      const isInput = target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA");
      // Don't hijack typing in form fields
      if (isInput) return;

      // ─── PHASE 0: RULE CARD — Enter advances to reflex ───
      if (phase === 0 && e.key === "Enter") {
        setPhase(1);
        e.preventDefault();
        return;
      }

      // ─── PHASE 1: REFLEX — Enter reveals or advances ───
      if (phase === 1 && e.key === "Enter") {
        const card = level.immersionCards[reflexIdx];
        const total = level.immersionCards.length;
        const halfway = Math.floor(total / 2);
        const isHalfwayBreak = reflexIdx === halfway && !halfwayDismissed && reflexIdx > 0 && !reflexRevealed;
        const isLast = reflexIdx >= total - 1;

        if (isHalfwayBreak) {
          setHalfwayDismissed(true);
        } else if (!reflexRevealed) {
          // Reveal the answer
          setReflexRevealed(true);
          if (progressActions) progressActions.awardReflexCard();
          setTimeout(() => speak(card.en), 250);
        } else {
          // Already revealed — advance
          if (isLast) {
            if (progressActions) progressActions.unlockAchievement("reflex_complete");
            setPhase(2);
          } else {
            setReflexIdx(i => i + 1);
            setReflexRevealed(false);
          }
        }
        e.preventDefault();
        return;
      }

      // ─── PHASE 2 + transformDone + !correctionDone: CORRECTION TASKS ───
      if (phase === 2 && transformDone && !correctionDone) {
        if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
        if (e.key === "Enter") {
          if (!correctionFb && correctionInput.trim()) { checkCorrection(); e.preventDefault(); }
          else if (correctionFb) { advanceCorrection(); e.preventDefault(); }
        }
        return;
      }

      // ─── PHASE 2 + transformDone + correctionDone: COMPRESSION CARD — Enter advances to exam ───
      if (phase === 2 && transformDone && correctionDone && e.key === "Enter") {
        setPhase(3);
        e.preventDefault();
        return;
      }

      // ─── PHASE 3: EXAM — 1-4 picks options, Enter submits / advances ───
      if (phase === 3) {
        if (!eq) return;
        const numKey = parseInt(e.key);
        if (!examRevealed && numKey >= 1 && numKey <= eq.opts.length) {
          setExamPicked(eq.opts[numKey - 1]);
          e.preventDefault();
        } else if (!examRevealed && (e.key === "Enter" || e.key === " ") && examPicked) {
          submitExam();
          e.preventDefault();
        } else if (examRevealed && (e.key === "Enter" || e.key === " " || e.key === "ArrowRight")) {
          advanceExam();
          e.preventDefault();
        }
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [phase, reflexIdx, reflexRevealed, halfwayDismissed, level, eq, examPicked, examRevealed, transformDone, correctionDone, correctionFb, correctionInput, correctionIdx]);

  // ─── TEACHER MODE GATING (early returns) ───
  // Step 1: TeacherIntroModal — ask if they want to listen first
  if (hasTeacher && teacherStage === "intro") {
    return (
      <section className="w-full max-w-3xl mx-auto">
        <div className="flex items-center gap-3 mb-8 flex-wrap">
          <button onClick={onBack} className="ink-faint hover:ink text-xs font-mono tracking-widest uppercase">← Map</button>
          <span className="ink-faint">·</span>
          <span className="font-cn-serif text-amber text-sm">{level.code} · {level.title}</span>
        </div>
        <TeacherIntroModal
          levelTitle={`${level.code} · ${level.title}`}
          onListen={() => { setTeacherStage("lesson"); setTeacherSkipped(false); }}
          onSkip={() => { setTeacherStage("done"); setTeacherSkipped(true); }}
        />
      </section>
    );
  }
  // Step 2: TeacherLesson — playing the scrollytelling lesson
  if (hasTeacher && teacherStage === "lesson") {
    return (
      <section className="w-full max-w-3xl mx-auto">
        <div className="flex items-center gap-3 mb-6 flex-wrap">
          <button onClick={onBack} className="ink-faint hover:ink text-xs font-mono tracking-widest uppercase">← Map</button>
          <span className="ink-faint">·</span>
          <span className="font-cn-serif text-amber text-sm">{level.code} · {level.title}</span>
        </div>
        <TeacherLesson
          script={level.teacherScript}
          levelTitle={`${level.code} · ${level.title}`}
          onContinue={() => setTeacherStage("done")}
          onSkip={() => { setTeacherStage("done"); setTeacherSkipped(true); }}
        />
      </section>
    );
  }
  // Step 3: ReboundPrompt — after fillTasks done, if errors >= 2 AND skipped originally AND not yet shown
  if (hasTeacher && phase === 2 && transformDone && transformErrors >= 2 && teacherSkipped && !reboundShown && !showRebound) {
    setShowRebound(true);
  }
  if (showRebound) {
    return (
      <section className="w-full max-w-3xl mx-auto">
        <div className="flex items-center gap-3 mb-8 flex-wrap">
          <button onClick={onBack} className="ink-faint hover:ink text-xs font-mono tracking-widest uppercase">← Map</button>
          <span className="ink-faint">·</span>
          <span className="font-cn-serif text-amber text-sm">{level.code} · {level.title}</span>
        </div>
        <ReboundPrompt
          errorCount={transformErrors}
          total={level.fillTasks.length}
          onReplay={() => { setShowRebound(false); setReboundShown(true); setTeacherStage("lesson"); }}
          onContinue={() => { setShowRebound(false); setReboundShown(true); }}
        />
      </section>
    );
  }

  return (
    <section className="w-full max-w-3xl mx-auto">
      {/* Header */}
      <div className="flex items-center gap-3 mb-8 flex-wrap">
        <button onClick={onBack} className="ink-faint hover:ink text-xs font-mono tracking-widest uppercase">← Map</button>
        <span className="ink-faint">·</span>
        <span className="font-cn-serif text-amber text-sm">{level.code} · {level.title}</span>
        <div className="ml-auto flex items-center gap-2">
          {["规则", "反射", "改写", "真题"].map((label, i) => (
            <div key={i} className={`font-cn text-xs px-2.5 py-1 rounded-full ${i === phase ? "bg-amber text-bg-deep font-medium" : i < phase ? "border border-amber/40 text-amber" : "border border-line text-ink-faint"}`}>
              {i+1}. {label}
            </div>
          ))}
        </div>
      </div>

      {/* PHASE 0: RULE CARD — minimal: just the formula + 2 examples
          Per onboarding-friction review: do NOT show "心理距离" axis here.
          A first-time student sees an intellectual frame as intimidation,
          not insight. Discovery > Explanation. */}
      {phase === 0 && (() => {
        // Determine where THIS lesson sits on the reality-distance spectrum
        let distancePos = "present_unreal";
        if (level.title.includes("混合虚拟"))           distancePos = "mixed";
        else if (level.title.includes("倒装"))          distancePos = "past_unreal";
        else if (level.title.includes("If I had"))      distancePos = "past_unreal";
        else if (level.title.includes("过去后悔"))      distancePos = "past_wish";
        else if (level.title.includes("If I were"))     distancePos = "present_unreal";
        else if (level.title.includes("现在不满"))      distancePos = "present_unreal";

        return (
        <div className="animate-fadeIn flex flex-col items-center justify-center min-h-[60vh] max-w-xl mx-auto text-center">
          <div className="ink-faint text-xs font-mono tracking-wider mb-6">STEP 1 / 4 · 看懂规则</div>

          {/* DISTANCE AXIS — show it FIRST, frame the lesson conceptually */}
          <DistanceAxis active={distancePos} />

          {/* REAL vs VIRTUAL — foundational reminder, appears on every level */}
          <div className="rounded-2xl bg-warm/30 border-2 border-amber/40 p-5 sm:p-6 mb-6 w-full text-left">
            <div className="font-cn text-amber text-xs font-mono tracking-wider mb-3 text-center">⚖ 这一关 · 表达"不可能 / 与现实相反"</div>
            <div className="grid grid-cols-2 gap-3 sm:gap-4">
              <div className="border-r border-line-mid pr-3 sm:pr-4">
                <div className="font-cn text-xs ink-dim mb-2">真实条件（可能）</div>
                <p className="font-mono text-[11px] sm:text-xs ink leading-snug mb-1">If you study hard,<br/>you <span className="text-mint font-bold">will</span> pass.</p>
                <p className="font-cn text-[10px] sm:text-[11px] ink-faint italic">→ will + 动原</p>
              </div>
              <div>
                <div className="font-cn text-xs ink-dim mb-2">虚拟条件（不可能）</div>
                <p className="font-mono text-[11px] sm:text-xs ink leading-snug mb-1">If I <span className="text-amber font-bold">were</span> you,<br/>I <span className="text-amber font-bold">would</span> tell him.</p>
                <p className="font-cn text-[10px] sm:text-[11px] ink-faint italic">→ would + 动原</p>
              </div>
            </div>
            <p className="font-cn ink-dim text-[11px] sm:text-xs mt-3 italic text-center">动词\"后退一步\" = 标记\"远离现实\"</p>
          </div>

          {/* The formula — the ONE thing they need to remember */}
          <div className="rounded-2xl border-2 border-mint/40 bg-mint-soft/20 px-6 py-7 sm:px-10 sm:py-8 mb-8 w-full">
            <div className="font-cn text-xs ink-dim mb-3 tracking-wider">这一关的公式</div>
            <p className="font-display text-2xl sm:text-3xl leading-relaxed">
              {level.title.includes("If I were") ? (
                <><span className="text-mint italic">If I were</span><span className="ink-dim"> + ___, </span><span className="text-amber italic">I would</span><span className="ink-dim"> + ___</span></>
              ) : level.title.includes("If I had") ? (
                <><span className="text-mint italic">If I had</span><span className="ink-dim"> + 过去分词, </span><span className="text-amber italic">I would have</span><span className="ink-dim"> + 过去分词</span></>
              ) : level.title.includes("过去后悔") ? (
                <><span className="text-mint italic">I wish</span><span className="ink-dim"> + 主语 + </span><span className="text-amber italic">had + 过去分词</span></>
              ) : level.title.includes("混合虚拟") ? (
                <><span className="text-mint italic">If had + 过去分词</span><span className="ink-dim"> (过去), </span><span className="text-amber italic">would + 动原</span><span className="ink-dim"> (现在)</span></>
              ) : level.title.includes("倒装") ? (
                <><span className="text-mint italic">Were / Had / Should</span><span className="ink-dim"> + 主语 + </span><span className="text-amber italic">...（去掉 if）</span></>
              ) : (
                <><span className="text-mint italic">I wish</span><span className="ink-dim"> + 主语 + </span><span className="text-amber italic">过去式</span></>
              )}
            </p>
          </div>

          {/* 2 examples — that's it */}
          <div className="space-y-2 mb-10 w-full">
            {level.immersionCards.slice(0, 2).map((c, i) => (
              <div key={i} className="text-left p-4 rounded-xl bg-warm/40 border border-line">
                <p className="font-display text-base sm:text-lg ink leading-snug mb-1">{c.en}</p>
                <p className="font-cn ink-dim text-sm">{c.cn}</p>
              </div>
            ))}
          </div>

          <motion.button
            onClick={() => setPhase(1)}
            whileHover={{ scale: 1.04 }}
            whileTap={{ scale: 0.96 }}
            transition={spring}
            className="font-cn btn-primary px-8 py-3.5 rounded-full text-base inline-flex items-center gap-3"
          >
            明白了，开始练 <span className="font-mono text-xs opacity-60 hidden sm:inline">⏎</span>
          </motion.button>
        </div>
        );
      })()}

      {/* PHASE 1: AUDIO REFLEX — say it first, then check */}
      {phase === 1 && (() => {
        const card = level.immersionCards[reflexIdx];
        const total = level.immersionCards.length;
        const halfway = Math.floor(total / 2);
        const isHalfwayBreak = reflexIdx === halfway && !halfwayDismissed && reflexIdx > 0 && !reflexRevealed;
        const isLast = reflexIdx >= total - 1;
        const reveal = () => {
          setReflexRevealed(true);
          if (progressActions) progressActions.awardReflexCard();
          setTimeout(() => speak(card.en), 250);
        };
        const advance = () => {
          if (isLast) {
            if (progressActions) progressActions.unlockAchievement("reflex_complete");
            setPhase(2);
          }
          else { setReflexIdx(i => i + 1); setReflexRevealed(false); }
        };

        // Halfway break — gives the brain a beat to consolidate (per pacing review)
        if (isHalfwayBreak) {
          return (
            <motion.div
              initial={{ opacity: 0, scale: 0.96 }}
              animate={{ opacity: 1, scale: 1 }}
              transition={spring}
              className="text-center max-w-md mx-auto"
            >
              <div className="text-6xl mb-6">☕</div>
              <div className="font-cn text-mint text-[10px] font-mono tracking-[0.3em] uppercase mb-3">已完成一半</div>
              <h2 className="font-cn-serif text-2xl sm:text-3xl ink leading-tight mb-4">
                你练了 {halfway} 张反射卡 · 大脑需要喘口气
              </h2>
              <p className="font-cn ink-dim text-sm leading-relaxed mb-8">
                短暂停顿能让记忆固化得更牢——这叫 spacing effect。
                下半场再 {total - halfway} 张，然后进入改写练习。
              </p>
              <div className="bg-mint-soft/20 border border-mint/30 rounded-2xl p-4 mb-8 text-left">
                <div className="font-cn ink-faint text-xs font-mono tracking-widest uppercase mb-2">回想一下你刚才学到的</div>
                <p className="font-cn-serif text-lg ink">If I were you, I would ___</p>
                <p className="font-cn ink-dim text-xs italic mt-1">如果我是你，我会……</p>
              </div>
              <motion.button
                onClick={() => setHalfwayDismissed(true)}
                whileHover={{ scale: 1.04 }}
                whileTap={{ scale: 0.96 }}
                transition={spring}
                className="font-cn btn-primary px-8 py-3.5 rounded-full text-base"
              >
                继续下半场 →
              </motion.button>
            </motion.div>
          );
        }

        return (
          <div className="animate-fadeIn flex flex-col items-center justify-center min-h-[60vh]">
            {/* ONLY: tiny progress */}
            <div className="ink-faint text-xs font-mono tracking-wider mb-12">{reflexIdx + 1} / {total}</div>

            {/* ONLY: the Chinese sentence (huge, centered) */}
            <AnimatePresence mode="wait" initial={false}>
              <motion.div
                key={reflexIdx + (reflexRevealed ? "-en" : "-cn")}
                initial={{ y: 20, opacity: 0 }}
                animate={{ y: 0, opacity: 1 }}
                exit={{ y: -20, opacity: 0 }}
                transition={spring}
                className="w-full max-w-xl"
              >
                {!reflexRevealed ? (
                  <p className="font-cn-serif text-3xl sm:text-4xl ink leading-tight text-center mb-12">
                    {card.cn}
                  </p>
                ) : (
                  <p className="font-display text-3xl sm:text-4xl ink leading-snug text-center mb-12">
                    {card.en}
                  </p>
                )}
              </motion.div>
            </AnimatePresence>

            {/* ONLY: one button */}
            {!reflexRevealed ? (
              <motion.button
                onClick={reveal}
                whileHover={{ scale: 1.04 }}
                whileTap={{ scale: 0.96 }}
                transition={spring}
                className="font-cn btn-primary px-8 py-3.5 rounded-full text-base inline-flex items-center gap-3"
              >
                看英文 <span className="font-mono text-xs opacity-60 hidden sm:inline">⏎</span>
              </motion.button>
            ) : (
              <div className="flex items-center gap-4">
                <button onClick={() => speak(card.en)} aria-label="再听一遍" className="ink-faint hover:text-mint w-11 h-11 rounded-full border border-line-mid flex items-center justify-center text-base">
                  ▶
                </button>
                <motion.button
                  onClick={advance}
                  whileHover={{ scale: 1.04 }}
                  whileTap={{ scale: 0.96 }}
                  transition={spring}
                  className="font-cn btn-primary px-8 py-3.5 rounded-full text-base inline-flex items-center gap-3"
                >
                  {isLast ? "完成" : "下一句"} <span className="font-mono text-xs opacity-60 hidden sm:inline">⏎</span>
                </motion.button>
              </div>
            )}
          </div>
        );
      })()}

      {/* PHASE 2: TRANSFORM */}
      {phase === 2 && !transformDone && (
        <div key={transformIdx} className="animate-fadeIn">
          <div className="font-cn text-amber text-xs font-mono tracking-[0.3em] uppercase mb-3">STEP 3 / 4 · 改写 · {transformIdx + 1} / {level.fillTasks.length}</div>
          <h2 className="font-cn-serif text-3xl leading-tight mb-3">{(level.transformUI && level.transformUI.title) || "改写练习"}</h2>

          <div className="bg-warm/60 border border-line-mid rounded-2xl p-6 sm:p-8 mt-6">
            <div className="text-amber text-[10px] font-mono tracking-[0.3em] uppercase mb-2">{(level.transformUI && level.transformUI.realityLabel) || "REALITY · 现实"}</div>
            <p className="font-display text-xl mb-1 ink">"{tt.prompt}"</p>
            <p className="font-cn ink-dim text-sm mb-6">{tt.promptCN}</p>

            <div className="text-mint text-[10px] font-mono tracking-[0.3em] uppercase mb-2">{(level.transformUI && level.transformUI.writeLabel) || "YOUR REWRITE · 选词拼句"}</div>

            {/* 已选词区 */}
            <div className="min-h-[64px] rounded-xl bg-deep/30 border-2 border-dashed border-line-mid px-4 py-3 mb-3 flex flex-wrap gap-2 items-center">
              {tilePicked.length === 0 && (
                <span className="font-cn ink-faint text-sm">↓ 从下方点选单词组成英文句子</span>
              )}
              {tilePicked.map((id, i) => {
                const t = tilePool.find(x => x.id === id);
                if (!t) return null;
                return (
                  <button
                    key={`p-${id}-${i}`}
                    onClick={() => onUnpickTile(id)}
                    disabled={transformFb && transformFb.kind === "correct"}
                    className="font-mono px-3 py-1.5 rounded-lg bg-amber/20 border border-amber/50 text-amber hover:bg-amber/30 transition text-sm"
                    title="点击移除"
                  >
                    {t.word}
                  </button>
                );
              })}
            </div>

            {/* 单词磁贴池 */}
            <div className="rounded-xl bg-warm/30 border border-line-mid px-4 py-3 mb-3 flex flex-wrap gap-2">
              {tilePool.map(t => {
                const used = tilePicked.includes(t.id);
                return (
                  <button
                    key={`b-${t.id}`}
                    onClick={() => onPickTile(t.id)}
                    disabled={used || (transformFb && transformFb.kind === "correct")}
                    className={`font-mono px-3 py-1.5 rounded-lg border text-sm transition ${
                      used
                        ? "border-line-mid bg-deep/20 ink-faint opacity-40 cursor-not-allowed"
                        : "border-mint/40 bg-mint-soft/20 ink hover:bg-mint-soft/40 hover:border-mint"
                    }`}
                  >
                    {t.word}
                  </button>
                );
              })}
            </div>

            <div className="font-cn ink-faint text-xs mt-2 leading-relaxed">
              💡 <MD text={tt.hintCN} />
            </div>

            <div className="mt-4 flex items-center gap-3 flex-wrap">
              <button data-quiz-submit onClick={onCheckTiles} disabled={tilePicked.length === 0 || (transformFb && transformFb.kind === "correct")} className="font-cn btn-primary px-6 py-2.5 rounded-full text-sm disabled:opacity-50">检查</button>
              <button onClick={onClearPicked} disabled={tilePicked.length === 0 || (transformFb && transformFb.kind === "correct")} className="font-cn btn-ghost px-5 py-2.5 rounded-full text-sm disabled:opacity-50">清空</button>
              <button onClick={() => { setTransformReveal(true); setTransformFb({kind:"wrong",msg:"看一下参考答案，跟着读一遍。",target:tt.model}); }} className="font-cn btn-ghost px-5 py-2.5 rounded-full text-sm">直接看答案</button>
              <span className="ink-faint text-xs ml-auto font-cn hide-mobile">Enter 提交</span>
            </div>
          </div>

          {transformFb && (
            <div className={`mt-4 rounded-xl border p-5 animate-fadeInUp ${
              transformFb.kind === "correct" ? "border-mint bg-mint-soft"
              : transformFb.kind === "acceptable" ? "border-mint bg-mint-soft"
              : transformFb.kind === "specific" ? "border-amber bg-amber-soft"
              : "border-rose bg-rose-soft"
            }`}>
              <div className="flex items-center gap-2 text-xs font-mono tracking-widest uppercase mb-3">
                {transformFb.kind === "correct" && <span className="text-mint">✓ 正确</span>}
                {transformFb.kind === "acceptable" && <span className="text-mint">✓ 语法正确 · 还能更地道</span>}
                {transformFb.kind === "specific" && <span className="text-amber">⚠ 接近，需微调</span>}
                {transformFb.kind === "wrong" && <span className="text-rose">✗ 需要重写</span>}
              </div>
              <p className="font-cn ink leading-relaxed text-[15px]"><MD text={transformFb.msg} /></p>

              {/* Side-by-side comparison · for non-correct cases that have something to compare.
                  "acceptable" gets friendly framing — student's answer is shown in mint (green), not rose (red). */}
              {transformFb.kind !== "correct" && transformInput.trim() && (
                <div className="mt-4 pt-4 border-t border-white/10 space-y-2">
                  <div className="font-cn ink-faint text-[10px] tracking-widest uppercase mb-2">
                    {transformFb.kind === "acceptable" ? "💎 对比 · 你的写法 vs 更地道的表达" : "📝 对比 · 你写的 vs 标准答案"}
                  </div>
                  <div className={`rounded-lg px-3 py-2 ${transformFb.kind === "acceptable" ? "bg-mint-soft/40 border border-mint/30" : "bg-rose/10 border border-rose/30"}`}>
                    <div className={`font-cn text-[10px] mb-1 tracking-wider ${transformFb.kind === "acceptable" ? "text-mint" : "text-rose"}`}>你写的</div>
                    <p className="font-mono text-sm ink leading-snug break-words">{transformInput.trim()}</p>
                  </div>
                  <div className="rounded-lg bg-mint-soft/30 border border-mint/40 px-3 py-2">
                    <div className="font-cn text-[10px] text-mint mb-1 tracking-wider">{transformFb.kind === "acceptable" ? "💎 更地道的说法" : "✓ 标准答案"}</div>
                    <p className="font-mono text-sm ink leading-snug break-words">{transformFb.target}</p>
                  </div>
                </div>
              )}

              {(transformReveal || transformFb.kind === "correct") && transformFb.kind === "correct" && (
                <div className="mt-4 pt-4 border-t border-white/10">
                  <div className="font-cn ink-faint text-[10px] tracking-widest uppercase mb-1">参考答案</div>
                  <p className="font-display italic text-lg">"{transformFb.target}"</p>
                </div>
              )}
            </div>
          )}

          <div className="mt-8 flex justify-end">
            <button data-quiz-submit onClick={advanceTransform} disabled={!transformFb}
              className={`font-cn px-8 py-3.5 rounded-full inline-flex items-center gap-3 transition-all ${transformFb ? "btn-primary" : "btn-ghost cursor-not-allowed opacity-50"}`}>
              下一题 <span className="font-mono">→</span>
            </button>
          </div>
        </div>
      )}
      {/* PHASE 2.5: ERROR CORRECTION (P1 #1) — only if level has correctionTasks */}
      {phase === 2 && transformDone && !correctionDone && ct && (
        <div key={`ct-${correctionIdx}`} className="animate-fadeIn">
          <div className="flex items-baseline justify-between gap-2 flex-wrap mb-3">
            <div className="font-cn text-rose text-xs font-mono tracking-[0.3em] uppercase">STEP 3.5 / 4 · 改错题 · {correctionIdx + 1} / {correctionList.length}</div>
            <div className="ink-faint text-[10px] font-mono hidden sm:block">⌨ Enter 检查</div>
          </div>

          <div className="bg-warm/60 border border-line-mid rounded-2xl p-6 sm:p-8">
            <div className="mb-5">
              <div className="font-cn text-rose text-xs font-mono mb-2 tracking-wider">📝 找出错误并改正</div>
              {ct.hintCN && <p className="font-cn ink-dim text-xs mb-3 italic">{ct.hintCN}</p>}
              <div className="rounded-xl bg-rose/10 border-2 border-rose/40 px-4 py-4 mb-4">
                <div className="font-cn text-[10px] text-rose mb-2 tracking-wider">❌ 错句</div>
                <p className="font-mono text-base sm:text-lg ink leading-snug">{ct.wrong}</p>
              </div>
            </div>

            <div className="mb-4">
              <label className="font-cn ink-dim text-xs block mb-2">写出正确版本：</label>
              <textarea
                value={correctionInput}
                onChange={e => setCorrectionInput(e.target.value)}
                disabled={correctionFb && correctionFb.kind === "correct"}
                placeholder="把错误改正后写在这里..."
                rows={2}
                className="w-full bg-deep/40 border-2 border-line-mid focus:border-mint focus:outline-none rounded-xl px-4 py-3 font-mono text-base ink resize-none"
              />
            </div>

            <div className="flex flex-wrap items-center gap-2 mb-3">
              <button onClick={checkCorrection} disabled={!correctionInput.trim() || (correctionFb && correctionFb.kind === "correct")} className="font-cn btn-primary px-6 py-2.5 rounded-full text-sm disabled:opacity-50">检查</button>
              <button onClick={() => { setCorrectionRevealed(true); setCorrectionFb({ kind: "wrong", msg: "看一下答案，认真比对每个错误。", target: ct.model }); }} className="font-cn btn-ghost px-5 py-2.5 rounded-full text-sm">直接看答案</button>
            </div>

            {correctionFb && (
              <div className={`mt-4 rounded-xl border p-5 animate-fadeInUp ${
                correctionFb.kind === "correct" ? "border-mint bg-mint-soft" : "border-rose bg-rose-soft"
              }`}>
                <div className="flex items-center gap-2 text-xs font-mono tracking-widest uppercase mb-3">
                  {correctionFb.kind === "correct" ? <span className="text-mint">✓ 改对了</span> : <span className="text-rose">✗ 还没改对</span>}
                </div>
                <p className="font-cn ink leading-relaxed text-[15px]"><MD text={correctionFb.msg} /></p>

                {/* Side-by-side wrong vs correct */}
                {correctionFb.kind === "wrong" && correctionInput.trim() && (
                  <div className="mt-4 pt-4 border-t border-white/10 space-y-2">
                    <div className="font-cn ink-faint text-[10px] tracking-widest uppercase mb-2">📝 对比 · 你写的 vs 标准答案</div>
                    <div className="rounded-lg bg-rose/10 border border-rose/30 px-3 py-2">
                      <div className="font-cn text-[10px] text-rose mb-1 tracking-wider">你写的</div>
                      <p className="font-mono text-sm ink leading-snug break-words">{correctionInput.trim()}</p>
                    </div>
                    <div className="rounded-lg bg-mint-soft/30 border border-mint/40 px-3 py-2">
                      <div className="font-cn text-[10px] text-mint mb-1 tracking-wider">✓ 标准答案</div>
                      <p className="font-mono text-sm ink leading-snug break-words">{correctionFb.target}</p>
                    </div>
                  </div>
                )}

                {/* Per-error annotations */}
                {(correctionFb.kind === "correct" || correctionRevealed) && ct.errors && ct.errors.length > 0 && (
                  <div className="mt-4 pt-4 border-t border-white/10">
                    <div className="font-cn ink-faint text-[10px] tracking-widest uppercase mb-3">📋 错误清单</div>
                    <div className="space-y-2">
                      {ct.errors.map((err, i) => (
                        <div key={i} className="rounded-lg bg-warm/30 px-3 py-2.5 border border-line-mid">
                          <div className="flex items-baseline gap-2 flex-wrap mb-1">
                            <span className="font-mono text-xs text-rose">❌ {err.spot}</span>
                            <span className="ink-faint text-xs">→</span>
                            <span className="font-mono text-xs text-mint">✓ {err.fix}</span>
                          </div>
                          <p className="font-cn text-xs ink-dim leading-relaxed">{err.note}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            <div className="mt-6 flex justify-end">
              <button onClick={advanceCorrection} disabled={!correctionFb}
                className={`font-cn px-8 py-3.5 rounded-full inline-flex items-center gap-3 transition-all ${correctionFb ? "btn-primary" : "btn-ghost cursor-not-allowed opacity-50"}`}>
                {correctionIdx + 1 >= correctionList.length ? "完成改错" : "下一题"} <span className="font-mono">→</span>
              </button>
            </div>
          </div>
        </div>
      )}

      {phase === 2 && transformDone && correctionDone && (
        <CompressionCard comp={level.compression} onContinue={() => setPhase(3)} />
      )}

      {/* PHASE 3: EXAM */}
      {phase === 3 && !examDone && eq && (
        <div key={examIdx} className="animate-fadeIn">
          <div className="flex items-baseline justify-between gap-2 flex-wrap mb-3">
            <div className="font-cn text-amber text-xs font-mono tracking-[0.3em] uppercase">STEP 4 / 4 · 真题 · {examIdx + 1} / {lvlQuestions.length}</div>
            <div className="ink-faint text-[10px] font-mono hidden sm:block">⌨ 1-4 选答案 · Enter 提交</div>
          </div>

          <div className="bg-warm/60 border border-line-mid rounded-2xl p-6 sm:p-8">
            <div className="ink-faint text-[10px] font-mono tracking-[0.3em] uppercase mb-3">{eq.point}</div>
            <p className="font-display text-xl sm:text-2xl leading-relaxed mb-6">{eq.stem}</p>

            <div className="space-y-2">
              {eq.opts.map(opt => {
                const isPicked = examPicked && examPicked.id === opt.id;
                const showCorrect = examRevealed && opt.correct;
                const showWrong = examRevealed && isPicked && !opt.correct;
                return (
                  <button key={opt.id}
                    onClick={() => !examRevealed && setExamPicked(opt)}
                    disabled={examRevealed}
                    className={`w-full text-left rounded-lg px-4 py-3 border flex items-center gap-3 transition-all ${
                      showCorrect ? "border-mint bg-mint-soft"
                      : showWrong ? "border-rose bg-rose-soft"
                      : isPicked ? "border-amber bg-amber-soft"
                      : "border-line-mid hover:border-ink-faint"
                    }`}>
                    <span className={`font-mono text-xs w-5 ${showCorrect ? "text-mint" : showWrong ? "text-rose" : isPicked ? "text-amber" : "ink-faint"}`}>{opt.id}</span>
                    <span className="font-mono text-sm ink flex-1">{opt.text}</span>
                    {showCorrect && <span className="text-mint">✓</span>}
                    {showWrong && <span className="text-rose">✗</span>}
                  </button>
                );
              })}
            </div>

            {!examRevealed && examPicked && (
              <div className="mt-5 flex justify-end">
                <button onClick={submitExam} className="font-cn btn-primary px-6 py-2.5 rounded-full text-sm">提交答案</button>
              </div>
            )}
          </div>

          {examRevealed && (
            <div className={`mt-4 rounded-xl border p-5 animate-fadeInUp ${examPicked.correct ? "border-mint bg-mint-soft" : "border-rose bg-rose-soft"}`}>
              <div className="text-xs font-mono tracking-widest uppercase mb-3">
                {examPicked.correct
                  ? <span className="text-mint">✓ 正确</span>
                  : <span className="text-rose">✗ 错误 · 答案是 {eq.opts.find(o=>o.correct).id}</span>}
              </div>
              <div className="space-y-3">
                <div>
                  <div className="font-cn text-amber text-xs font-medium mb-1 tracking-wider">📖 解析</div>
                  <p className="font-cn ink leading-relaxed text-sm">{eq.why}</p>
                </div>
                <div className="pt-3 border-t border-white/10">
                  <div className="font-cn text-amber text-xs font-medium mb-1 tracking-wider">⚠ 易错陷阱</div>
                  <p className="font-cn ink-dim leading-relaxed text-sm">{eq.trap}</p>
                </div>
                <div className="pt-3 border-t border-white/10 ink-faint text-xs font-cn">
                  <span className="font-mono">SOURCE</span> · {eq.src}
                </div>
              </div>
              <div className="mt-4 flex justify-end">
                <button onClick={advanceExam} className="font-cn btn-primary px-6 py-2.5 rounded-full text-sm">
                  {examIdx + 1 === lvlQuestions.length ? `完成 ${level.code}` : "下一题"} <span className="font-mono">→</span>
                </button>
              </div>
            </div>
          )}
        </div>
      )}
      {phase === 3 && examDone && (() => {
        const passThreshold = Math.ceil(lvlQuestions.length * 0.8); // 4/5 = 80%
        const softPassThreshold = Math.ceil(lvlQuestions.length * 0.6); // 3/5 = 60%
        const isMastered = examScore >= passThreshold;
        const isSoftPass = examScore >= softPassThreshold && examScore < passThreshold;
        const isFail = examScore < softPassThreshold;

        const masteryLabel = isMastered ? "✓ 通过 · 掌握" : isSoftPass ? "⚠ 勉强通过" : "✗ 未达标";
        const masteryColor = isMastered ? "text-mint" : isSoftPass ? "text-amber" : "text-rose";
        const masteryIcon = isMastered ? "🎯" : isSoftPass ? "📈" : "🔁";

        const resetForRetry = () => {
          setPhase(0);
          setReflexIdx(0); setReflexRevealed(false); setHalfwayDismissed(false);
          setTransformIdx(0); setTransformInput(""); setTransformFb(null); setTransformReveal(false);
          setTransformErrors(0);
          setCorrectionIdx(0); setCorrectionInput(""); setCorrectionFb(null); setCorrectionRevealed(false);
          setExamIdx(0); setExamPicked(null); setExamRevealed(false); setExamScore(0);
          setShowRebound(false); setReboundShown(false);
          // Don't reset teacherStage — they already saw it
        };

        return (
          <div className="animate-fadeIn text-center py-8 max-w-xl mx-auto">
            <div className="text-6xl mb-4">{masteryIcon}</div>

            {/* Score display */}
            <div className="rounded-3xl border-2 border-mint/30 bg-mint-soft/15 p-6 mb-5">
              <h3 className="font-cn-serif text-2xl mb-3">{level.code} · {level.title}</h3>
              <div className="flex items-baseline justify-center gap-2 mb-3">
                <span className={`font-display text-6xl font-bold leading-none ${masteryColor}`}>{examScore}</span>
                <span className="font-cn ink-dim text-lg">/ {lvlQuestions.length}</span>
              </div>
              <p className={`font-cn font-medium ${masteryColor} text-lg mb-2`}>{masteryLabel}</p>
              <p className="font-cn ink-dim text-sm">
                {isMastered && "✓ 这一关已掌握。本关考点的离散题型基本不丢分。"}
                {isSoftPass && "差一点就稳了。建议重做一次，把那 1-2 道弄透。"}
                {isFail && "这一关还没掌握，5 道里超过一半错了。强烈建议重做——硬继续会留下漏洞。"}
              </p>
            </div>

            {/* Action buttons — different prominence based on mastery */}
            {isMastered && (
              <div className="space-y-3">
                <motion.button
                  onClick={() => onComplete(examScore)}
                  whileHover={{ scale: 1.04 }}
                  whileTap={{ scale: 0.96 }}
                  className="w-full font-cn px-8 py-3.5 rounded-full bg-mint text-bg-deep hover:bg-mint/90 transition text-base font-medium inline-flex items-center justify-center gap-3"
                >
                  ✓ 通过 · 进入下一关
                </motion.button>
                <button onClick={resetForRetry} className="font-cn ink-dim hover:ink text-sm">
                  ↻ 想再练一遍（追求满分）
                </button>
                <p className="font-cn ink-faint text-xs italic mt-3">
                  数据已保存。<span className="text-mint">24 小时后</span>系统会在主页提醒你复习——间隔重复巩固记忆。
                </p>
              </div>
            )}

            {isSoftPass && (
              <div className="space-y-3">
                <motion.button
                  onClick={resetForRetry}
                  whileHover={{ scale: 1.04 }}
                  whileTap={{ scale: 0.96 }}
                  className="w-full font-cn px-8 py-3.5 rounded-full bg-amber text-bg-deep hover:bg-amber/90 transition text-base font-medium inline-flex items-center justify-center gap-3"
                >
                  ↻ 再练一遍（推荐 · 把它做透）
                </motion.button>
                <button onClick={() => onComplete(examScore)} className="font-cn ink-dim hover:ink text-sm underline">
                  我懂了，继续下一关 →
                </button>
                <p className="font-cn ink-faint text-xs italic mt-3 leading-relaxed">
                  ⚠ 选择"继续"会把这关标记为"勉强通过"。<br/>
                  考试时这一关的题型可能还会丢分。
                </p>
              </div>
            )}

            {isFail && (
              <div className="space-y-3">
                <motion.button
                  onClick={resetForRetry}
                  whileHover={{ scale: 1.04 }}
                  whileTap={{ scale: 0.96 }}
                  className="w-full font-cn px-8 py-3.5 rounded-full bg-rose text-warm hover:bg-rose/90 transition text-base font-medium inline-flex items-center justify-center gap-3"
                >
                  🔁 必须重做这一关
                </motion.button>
                <p className="font-cn ink-faint text-xs italic mt-3 leading-relaxed">
                  💡 建议：重做时仔细看每个错题的解析，<br/>
                  特别关注\"为什么用 X 不用 Y\"。
                </p>
                <button onClick={() => onComplete(examScore)} className="font-cn ink-faint hover:ink-dim text-xs underline opacity-50 mt-4">
                  仍然继续（不推荐）
                </button>
              </div>
            )}
          </div>
        );
      })()}
    </section>
  );
}

/* ════════════════════════════════════════════════════════════════════
   MISTAKES NOTEBOOK — 错题本，跨会话持久化
═══════════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════════════
   INTERLEAVING TRAINER — 混合识别训练器
   Per user's spec: 2-step recognition. First identify the "world",
   then answer. Tracks errors by category — most exam mistakes come
   from misidentifying the type, not from grammar weakness.
═══════════════════════════════════════════════════════════════════ */
function InterleavingTrainer({ onBack, progress, progressActions }) {
  const [phase, setPhase] = useState(0);            // 0=mode select, 1=trainer, 2=results
  const [mode, setMode] = useState(null);
  const [pool, setPool] = useState([]);
  const [idx, setIdx] = useState(0);

  // Per-question state
  const [step, setStep] = useState(0);              // 0=identify world, 1=pick answer, 2=feedback
  const [worldPick, setWorldPick] = useState(null);
  const [answerPick, setAnswerPick] = useState(null);
  const [worldErrors, setWorldErrors] = useState(0);
  const [answerErrors, setAnswerErrors] = useState(0);
  const [results, setResults] = useState([]);       // history per question

  // Random shuffle helper
  const shuffle = (a) => {
    const arr = [...a];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  const startMode = (m) => {
    let questions = [];
    const allWithWorld = [
      ...QUESTION_BANK.map(q => ({ ...q, world: q.world || QUESTION_WORLD_MAP[q.id] || "present" })),
      ...REAL_CONDITIONAL_DECOYS,
    ];
    if (m === "double") questions = allWithWorld.filter(q => q.lvl === 1 || q.lvl === 2 || q.world === "real");
    else if (m === "triple") questions = allWithWorld.filter(q => q.lvl <= 4 || q.world === "real");
    else questions = allWithWorld;

    setPool(shuffle(questions).slice(0, 8));
    setMode(m);
    setIdx(0); setStep(0);
    setWorldPick(null); setAnswerPick(null);
    setWorldErrors(0); setAnswerErrors(0);
    setResults([]);
    setPhase(1);
  };

  const current = pool[idx];

  // World identification
  const submitWorld = () => {
    if (!worldPick) return;
    if (worldPick === current.world) {
      setStep(1);  // proceed to answer
    } else {
      setStep(2);  // wrong world — show what world it actually is
      setWorldErrors(e => e + 1);
    }
  };

  // Answer selection
  const submitAnswer = () => {
    if (!answerPick) return;
    setStep(2);
    if (answerPick.correct) {
      if (progressActions) progressActions.recordCorrect();
    } else {
      setAnswerErrors(e => e + 1);
      if (progressActions) {
        progressActions.recordMistake("interleaving", {
          qId: current.id, picked: answerPick.id,
          correctAnswer: current.opts.find(o => o.correct).id,
          stem: current.stem, point: current.point,
        });
      }
    }
    // Unlock interleaving achievement on first try
    if (progressActions && idx === 0) progressActions.unlockAchievement("interleaving");
  };

  const advance = () => {
    setResults(r => [...r, {
      id: current.id,
      worldRight: worldPick === current.world,
      answerRight: answerPick && answerPick.correct,
    }]);
    if (idx + 1 >= pool.length) {
      setPhase(2);
    } else {
      setIdx(idx + 1); setStep(0);
      setWorldPick(null); setAnswerPick(null);
    }
  };

  const correct = current && current.opts.find(o => o.correct);
  const actualWorld = current && WORLDS.find(w => w.id === current.world);

  // ─── Phase 0: Mode select ───
  if (phase === 0) {
    return (
      <section className="w-full max-w-3xl mx-auto">
        <div className="flex items-center gap-3 mb-8">
          <button onClick={onBack} className="ink-faint hover:ink text-xs font-mono tracking-widest uppercase">← Home</button>
          <span className="ink-faint">·</span>
          <span className="font-cn-serif text-amber text-sm">混合识别训练 · Interleaving</span>
        </div>

        <h2 className="font-cn-serif text-3xl sm:text-4xl leading-tight mb-3">先识别题型，再做答</h2>
        <p className="font-cn ink-dim text-sm leading-relaxed max-w-2xl mb-3">
          中高考虚拟语气最难的不是语法，而是<span className="text-amber">第一秒判断出"这道题属于哪种虚拟"</span>。
          这个训练器把所有 5 种虚拟世界 + 真实条件诱饵混在一起——

function MistakesNotebook({ onBack, progress }) {
  const mistakes = progress.mistakes || [];

  // Group mistakes by knowledge point
  const byPoint = {};
  mistakes.forEach(m => {
    const k = m.point || "未分类";
    if (!byPoint[k]) byPoint[k] = [];
    byPoint[k].push(m);
  });

  const formatTime = (iso) => {
    const d = new Date(iso);
    const diff = Date.now() - d.getTime();
    const days = Math.floor(diff / 86400000);
    if (days === 0) return "今天";
    if (days === 1) return "昨天";
    if (days < 7)   return `${days} 天前`;
    return d.toLocaleDateString("zh-CN");
  };

  return (
    <section className="w-full max-w-3xl mx-auto">
      <div className="flex items-center gap-3 mb-8">
        <button onClick={onBack} className="ink-faint hover:ink text-xs font-mono tracking-widest uppercase">← Home</button>
        <span className="ink-faint">·</span>
        <span className="font-cn-serif text-amber text-sm">错题本 · Mistakes Notebook</span>
      </div>

      <h2 className="font-cn-serif text-3xl sm:text-4xl leading-tight mb-3">你的错题本</h2>
      <p className="font-cn ink-dim text-sm leading-relaxed mb-8 max-w-2xl">
        系统自动记录你做错的每一道题——按知识点分组，跨会话保存。
        <span className="text-mint">基于 localStorage 持久化</span>——下次打开还在。
      </p>

      {mistakes.length === 0 && (
        <div className="text-center py-16 bg-warm/30 rounded-2xl border border-line">
          <div className="text-5xl mb-4 opacity-50">📓</div>
          <p className="font-cn ink-dim">还没有错题——做几道真题来测试一下吧。</p>
        </div>
      )}

      {mistakes.length > 0 && (
        <>
          <div className="rounded-xl border border-amber/30 bg-amber-soft/15 p-4 mb-6">
            <p className="font-cn ink text-sm">
              共 <span className="text-amber font-medium">{mistakes.length}</span> 个错题，分布在 <span className="text-amber font-medium">{Object.keys(byPoint).length}</span> 个知识点上。
              真实产品里，AI 会基于这些错题模式优先安排复习。
            </p>
          </div>

          <div className="space-y-6">
            {Object.entries(byPoint).map(([point, items]) => (
              <div key={point} className="rounded-2xl border border-line-mid bg-warm/40 p-5">
                <div className="flex items-baseline justify-between mb-4 gap-3 flex-wrap">
                  <h3 className="font-cn-serif text-lg ink">{point}</h3>
                  <span className="font-mono text-xs text-rose">{items.length} 个错题</span>
                </div>
                <div className="space-y-3">
                  {items.map((m, i) => (
                    <div key={i} className="bg-deep/40 rounded-lg p-4 border border-line">
                      <div className="font-cn ink-faint text-xs mb-2 flex items-center justify-between gap-3">
                        <span>Level {m.levelId} · {m.qId}</span>
                        <span>{formatTime(m.date)}</span>
                      </div>
                      <p className="font-display text-sm leading-snug mb-2">{m.stem}</p>
                      <div className="font-cn text-xs flex items-center gap-3">
                        <span className="text-rose">你选: {m.picked}</span>
                        <span className="text-mint">正解: {m.correctAnswer}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </section>
  );
}

function ExamBridge({ onBack, onRestart }) {
  const [sub, setSub] = useState(0);
  // 0 = rules, 1 = MC practice, 2 = writing, 3 = mastery dashboard
  const [examResults, setExamResults] = useState({}); // { questionId: { correct, picked } }
  const [writingPassed, setWritingPassed] = useState(null);

  const next = () => setSub(s => Math.min(s + 1, 3));
  const prev = () => setSub(s => Math.max(s - 1, 0));

  return (
    <section className="w-full max-w-4xl mx-auto">
      {/* Sub-stage breadcrumb */}
      <div className="flex items-center justify-between mb-8 flex-wrap gap-3">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="ink-faint hover:ink text-xs font-mono tracking-widest uppercase">← Lab</button>
          <span className="ink-faint">·</span>
          <span className="font-cn-serif text-amber text-sm">应试桥梁 · Applied Mode</span>
        </div>
        <div className="flex items-center gap-2">
          {["规则","真题","写作","图谱"].map((label, i) => (
            <button key={i} onClick={() => i <= sub && setSub(i)}
              className={`font-cn text-xs px-3 py-1.5 rounded-full transition-all ${
                i === sub ? "bg-amber text-bg-deep font-medium"
                : i < sub ? "border border-amber/40 text-amber"
                : "border border-line text-ink-faint"
              }`}>
              {i+1}. {label}
            </button>
          ))}
        </div>
      </div>

      {sub === 0 && <ExamRulesScreen onNext={next} />}
      {sub === 1 && <ExamPracticeScreen onNext={next} results={examResults} setResults={setExamResults} />}

      {sub === 3 && <ExamMasteryScreen examResults={examResults} writingPassed={writingPassed} onRestart={onRestart} />}
    </section>
  );
}

/* ─── Sub-screen 2: 5 multiple-choice questions ─── */
function ExamPracticeScreen({ onNext, results, setResults }) {
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [revealed, setRevealed] = useState(false);

  const q = EXAM_QUESTIONS[idx];
  const done = idx >= EXAM_QUESTIONS.length;
  const correctOpt = q && q.options.find(o => o.correct);
  const isCorrect = picked && picked.correct;

  const submit = () => {
    if (!picked) return;
    setRevealed(true);
    setResults(r => ({ ...r, [q.id]: { correct: !!picked.correct, picked: picked.id, point: q.point } }));
  };

  const advance = () => {
    setIdx(i => i + 1);
    setPicked(null);
    setRevealed(false);
  };

  if (done) {
    const correctCount = Object.values(results).filter(r => r.correct).length;
    return (
      <div className="animate-fadeIn text-center py-10">
        <div className="text-6xl mb-4">{correctCount >= 4 ? "🎯" : correctCount >= 2 ? "📈" : "📊"}</div>
        <h3 className="font-cn-serif text-3xl mb-3">真题环节完成</h3>
        <p className="font-cn ink-dim mb-2">你答对了 <span className="text-mint font-bold text-2xl mx-1">{correctCount}</span> / {EXAM_QUESTIONS.length} 题</p>
        <p className="font-cn ink-faint text-sm mb-8 max-w-md mx-auto">
          {correctCount === 5 && "满分！可以直接进入 Level 02 挑战虚拟过去了。"}
          {correctCount === 4 && "很扎实。一道题失分是正常波动，掌握度 80%+ 已达中考稳定区。"}
          {correctCount === 3 && "及格水平。建议看完掌握度图谱后回头复习薄弱知识点。"}
          {correctCount <= 2 && "还需要巩固。这正是知识图谱要解决的——它会告诉你优先补哪个子点。"}
        </p>
        <button onClick={onNext} className="font-cn btn-primary px-8 py-3.5 rounded-full inline-flex items-center gap-3">
          下一步：写作迁移 <span className="font-mono">→</span>
        </button>
      </div>
    );
  }

  return (
    <div key={idx} className="animate-fadeIn">
      <div className="flex items-center justify-between mb-4 ink-faint font-mono text-xs tracking-widest">
        <span>STEP 2 / 4 · 真题演练 · {idx + 1} / {EXAM_QUESTIONS.length}</span>
        <span className="text-amber">{q.point}</span>
      </div>

      <div className="bg-warm/60 border border-line-mid rounded-2xl p-6 sm:p-8">
        <div className="ink-faint text-[10px] font-mono tracking-[0.3em] uppercase mb-3">STEM</div>
        <p className="font-display text-xl sm:text-2xl leading-relaxed mb-6">{q.stem}</p>

        <div className="space-y-2">
          {q.options.map(opt => {
            const isPicked = picked && picked.id === opt.id;
            const showCorrect = revealed && opt.correct;
            const showWrong   = revealed && isPicked && !opt.correct;
            return (
              <button key={opt.id}
                onClick={() => !revealed && setPicked(opt)}
                disabled={revealed}
                className={`w-full text-left rounded-xl px-5 py-3.5 border flex items-center gap-4 transition-all ${
                  showCorrect ? "border-mint bg-mint-soft"
                  : showWrong  ? "border-rose bg-rose-soft"
                  : isPicked   ? "border-amber bg-amber-soft"
                  : "border-line-mid hover:border-ink-faint"
                }`}>
                <span className={`font-mono text-sm w-6 ${
                  showCorrect ? "text-mint" : showWrong ? "text-rose" : isPicked ? "text-amber" : "ink-faint"
                }`}>{opt.id}</span>
                <span className="font-mono ink flex-1">{opt.text}</span>
                {showCorrect && <span className="text-mint text-sm">✓</span>}
                {showWrong   && <span className="text-rose text-sm">✗</span>}
              </button>
            );
          })}
        </div>

        {!revealed && (
          <div className="mt-5 flex justify-end">
            <button onClick={submit} disabled={!picked}
                    className={`font-cn px-6 py-2.5 rounded-full text-sm transition-all ${
                      picked ? "btn-primary" : "btn-ghost cursor-not-allowed opacity-50"
                    }`}>
              提交答案
            </button>
          </div>
        )}
      </div>

      {revealed && (
        <div className="mt-5 space-y-4 animate-fadeInUp">
          <div className={`rounded-xl border p-5 ${isCorrect ? "border-mint bg-mint-soft" : "border-rose bg-rose-soft"}`}>
            <div className="flex items-center gap-2 text-xs font-mono tracking-widest uppercase mb-3">
              {isCorrect
                ? <span className="text-mint">✓ 正确 · {q.point}</span>
                : <span className="text-rose">✗ 错误 · 正确答案是 {correctOpt.id}（{correctOpt.text}）</span>}
            </div>
            <div className="space-y-3">
              <div>
                <div className="font-cn text-amber text-xs font-medium mb-1 tracking-wider">📖 解析</div>
                <p className="font-cn ink leading-relaxed text-sm">{q.why}</p>
              </div>
              <div className="pt-3 border-t border-white/10">
                <div className="font-cn text-amber text-xs font-medium mb-1 tracking-wider">⚠ 易错陷阱</div>
                <p className="font-cn ink-dim leading-relaxed text-sm">{q.trap}</p>
              </div>
              <div className="pt-3 border-t border-white/10 ink-faint text-xs font-cn flex items-center gap-2">
                <span className="font-mono">SOURCE</span> · {q.source}
              </div>
            </div>
          </div>

          <div className="flex justify-end">
            <button onClick={advance} className="font-cn btn-primary px-7 py-3 rounded-full inline-flex items-center gap-3 text-sm">
              {idx + 1 === EXAM_QUESTIONS.length ? "看本轮总结" : "下一题"} <span className="font-mono">→</span>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── Sub-screen 3: writing application ─── */
function ExamWritingScreen({ onNext, passed, setPassed }) {
  const [text, setText] = useState("");
  const [feedback, setFeedback] = useState(null);

  const wordCount = text.trim().split(/\s+/).filter(Boolean).length;

  const check = () => {
    const norm = text.trim().toLowerCase().replace(/\s+/g, " ").replace(/[.!?]+$/, "");
    if (!norm) return;
    const ok = WRITING_SCENARIO.pattern.test(norm);
    if (ok) {
      setFeedback({ ok: true, msg: "结构完整：If I were you + I would/I'd + 动词原形。这就是中考/高考写作里最常用的虚拟句型。" });
      setPassed(true);
    } else if (/\bif i was you\b/i.test(norm)) {
      setFeedback({ ok: false, msg: "结构对了，但 'If I was you' 在标准写作里要写 'If I were you'。be 动词全用 were——这是必考点。" });
      setPassed(false);
    } else if (/\bif i were you\b/i.test(norm) && !/(would|i'd|could)/i.test(norm)) {
      setFeedback({ ok: false, msg: "前半句对了——但虚拟语气主句必须有 would / could / might，不能光写 If 从句。比如 'If I were you, I would wear a coat.'" });
      setPassed(false);
    } else {
      setFeedback({ ok: false, msg: "建议套用 'If I were you, I would…' 句型——这是给建议时最稳的虚拟语气结构。" });
      setPassed(false);
    }
  };

  return (
    <div className="animate-fadeIn">
      <div className="ink-faint text-[10px] font-mono tracking-[0.3em] uppercase mb-3">STEP 3 / 4 · 写作迁移</div>
      <h2 className="font-cn-serif text-3xl sm:text-4xl leading-tight mb-3">把语法用到真实场景</h2>
      <p className="font-cn ink-dim text-sm leading-relaxed mb-8 max-w-2xl">
        语法选择题做对，不等于考试作文里能用对。这一题模拟真实写作场景，要求你输出一个完整句子。
      </p>

      <div className="bg-warm/60 border border-line-mid rounded-2xl p-6 sm:p-8">
        <div className="font-cn text-amber text-xs font-medium tracking-wider mb-2">📍 场景</div>
        <p className="font-cn ink leading-relaxed mb-5">{WRITING_SCENARIO.context}</p>

        <div className="font-cn text-mint text-xs font-medium tracking-wider mb-2">✍️ 任务</div>
        <p className="font-cn ink leading-relaxed mb-5">{WRITING_SCENARIO.task}</p>

        <textarea rows="3" placeholder="If I were you, I'd…"
          value={text} onChange={(e) => { setText(e.target.value); setFeedback(null); }}
          disabled={passed === true} />

        <div className="mt-3 flex items-center justify-between">
          <span className="ink-faint text-xs font-mono tracking-widest">{wordCount} WORDS</span>
          {passed !== true && (
            <button onClick={check} disabled={!text.trim()} className="font-cn btn-primary px-6 py-2.5 rounded-full text-sm disabled:opacity-50">
              {feedback ? "再检查" : "检查我的句子"}
            </button>
          )}
        </div>
      </div>

      {feedback && (
        <div className={`mt-4 rounded-xl border p-5 animate-fadeInUp ${feedback.ok ? "border-mint bg-mint-soft" : "border-rose bg-rose-soft"}`}>
          <div className="flex items-center gap-2 text-xs font-mono tracking-widest uppercase mb-2">
            {feedback.ok ? <span className="text-mint">✓ 写作结构正确</span> : <span className="text-rose">✗ 还需调整</span>}
          </div>
          <p className="font-cn ink leading-relaxed text-sm">{feedback.msg}</p>
          {feedback.ok && (
            <div className="mt-4 pt-4 border-t border-white/10">
              <div className="font-cn text-mint text-xs tracking-wider mb-2">💡 其他参考答案</div>
              <ul className="space-y-1 ink-dim text-sm">
                {WRITING_SCENARIO.modelExamples.map((ex, i) => (
                  <li key={i} className="font-display italic">"{ex}"</li>
                ))}
              </ul>
            </div>
          )}
        </div>
      )}

      <div className="mt-8 flex justify-between items-center">
        <button onClick={() => { setPassed(false); onNext(); }} className="ink-faint hover:ink text-sm font-cn">跳过这一步 →</button>
        <button onClick={onNext} disabled={passed === null}
                className={`font-cn px-7 py-3 rounded-full inline-flex items-center gap-3 text-sm ${
                  passed !== null ? "btn-primary" : "btn-ghost cursor-not-allowed opacity-50"
                }`}>
          看掌握度图谱 <span className="font-mono">→</span>
        </button>
      </div>
    </div>
  );
}

/* ─── Sub-screen 4: CELEBRATE the specific win, with honest framing ─── */

      </div>

      {/* TODAY'S PROOF — real session data */}
      <div className="mt-8">
        <div className="font-cn ink-faint text-xs font-medium tracking-[0.2em] uppercase mb-4">✦ 今天的证据</div>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div className="bg-warm/40 border border-line-mid rounded-xl p-4">
            <div className="text-2xl font-display text-mint">5/5</div>
            <div className="font-cn ink-dim text-xs mt-1">改写练习完成</div>
          </div>
          <div className="bg-warm/40 border border-line-mid rounded-xl p-4">
            <div className="text-2xl font-display text-mint">3+</div>
            <div className="font-cn ink-dim text-xs mt-1">自由创作中重复了 If I were</div>
          </div>
          <div className="bg-warm/40 border border-line-mid rounded-xl p-4">
            <div className="text-2xl font-display text-mint">{examCorrect}/{examTotal}</div>
            <div className="font-cn ink-dim text-xs mt-1">真题选择答对</div>
          </div>
          <div className="bg-warm/40 border border-line-mid rounded-xl p-4">
            <div className="text-2xl font-display text-mint">{writingPassed ? "✓" : "—"}</div>
            <div className="font-cn ink-dim text-xs mt-1">写作迁移{writingPassed ? "通过" : ""}</div>
          </div>
        </div>
      </div>

      {/* NEXT — framed positively, optional, motivating */}
      <div className="mt-10 rounded-2xl border border-amber/30 bg-amber-soft/15 p-6 sm:p-7">
        <div className="font-cn text-amber text-xs font-medium tracking-[0.2em] uppercase mb-3">🌱 想继续探索吗？（完全可选）</div>
        <p className="font-cn ink leading-relaxed text-sm mb-5">
          虚拟语气还有 4 种"姊妹表达"。今天你掌握的是**最实用**的一种（给建议）。
          每一种都建立在你今天学会的"<span className="text-mint">were = 远离现实</span>"上——所以你已经迈过了最难的一道坎。
        </p>
        <div className="space-y-3">
          {[
            { name: "I wish I were…",     use: "表达对现状的遗憾",            time: "5 分钟",  hint: "'我真希望我是…'" },
            { name: "as if + 过去式",     use: "描述假装某种状态",            time: "5 分钟",  hint: "'他装作认识我'" },

      <div className="mt-8 rounded-2xl border border-mint/40 bg-mint-soft/30 p-6 sm:p-7 mb-8">

          <div className="w-9 h-9 rounded-full bg-mint flex items-center justify-center text-bg-deep font-display italic">A</div>

        </div>
        <p className="font-cn ink leading-relaxed text-sm mb-3">
          很多人学虚拟语气，是因为<span className="text-mint">考试要考</span>。但你今天学的 'If I were you, I would...'，
          <span className="text-amber">出了考场也能用一辈子</span>——这是为数不多的"考点 = 实用技能"的语法点。
        </p>
        <p className="font-cn ink-dim text-sm leading-relaxed mb-4">
          建议：今晚用微信给一个朋友发一条建议，必须包含 'If I were you'。一次真实使用，胜过 10 次刷题。
        </p>
        <div className="flex flex-wrap gap-3">
          <button className="font-cn btn-primary px-5 py-2 rounded-full text-sm">
            ✓ 接受挑战 · 今晚发一条
          </button>
          <button className="font-cn btn-ghost px-5 py-2 rounded-full text-sm">
            明天再说
          </button>
        </div>
      </div>

      {/* Closing */}
      <div className="border-t border-line pt-8 flex flex-wrap items-center justify-between gap-4">
        <div className="font-cn ink-faint text-xs">
          <span className="text-mint">If I were you, I would…</span> —— 这是你今天的英语收获。
        </div>
        <button onClick={onRestart} className="font-cn ink-faint hover:ink text-sm">↻ 再练一遍</button>
      </div>
    </div>
  );
}
