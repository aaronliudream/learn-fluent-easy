name: audio-audit

# 音频巡检（Phase A 审计逻辑的固化版）——小学 + 初中。
#
# 覆盖 primary 与 junior 两个学段。
# primary 全是 JSON 内容源，**不需要任何凭据**——只对公开 CDN 与生产站点发 HEAD。
# junior 有表源（junior_vocab / junior_listening_exercises），要连库读内容，
# 所以注入 VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY —— 用 repository
# **variables**（这两个值随前端 bundle 公开，不是密钥），不用 secrets。
# 仍然不需要写权限、不调 tts edge："生成"那一步（要 anon key 调 edge）不在这里跑。
#
# 这个 workflow 是**唯一**能发现"用 SQL 往 DB 加了内容却没生成音频"的地方——
# PR 闸按文件 diff 触发，看不到 DB 改动。
#
# 退出码语义（脚本定义）：
#   0 = 三条前置断言通过且缺失 ≤ 阈值
#   1 = 前置通过但有真实缺口
#   3 = **前置断言未通过 → 本轮结论作废**（假200 回归 / 金丝雀空转 / 游离目录），
#       这类失败要按"检查器坏了"处理，而不是"内容缺音频"
#   2 = 配置/覆盖率错误（新内容源没分类等）

on:
  workflow_dispatch:
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）。私有仓库的 Actions 分钟数是计费的。
    # primary 约 3400 次 HEAD（实测 4~6 分钟）；junior 约 14800 次（本地实测约 20 分钟，
    # CI 网络更快）。两段合计按周跑约 100~130 分钟/月。
    - cron: '0 2 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 巡检脚本只用 Node 内置模块（fs/path/crypto/fetch），不装依赖，省时间也省分钟数
      - name: 音频巡检（primary）
        run: node scripts/audio/audit-audio.mjs --section primary --threshold 0

      # junior 与 primary 有两点不同：
      #   ① 它有**表源**（junior_vocab / junior_listening_exercises），所以要能连库
      #      —— 那两个值随前端 bundle 公开，不是密钥，用 repository **variables** 而不是 secrets；
      #   ② 它是**唯一**能发现"用 SQL 加了内容但没生成音频"的地方（PR 闸看不到 DB 改动）。
      # threshold 0：junior 已经是 14770/14770，任何新增缺口都该当场判红，而不是攒着。
      - name: 音频巡检（junior）
        if: always()   # primary 红了也要跑 junior，一轮拿到两个学段的结论
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/audio/audit-audio.mjs --section junior --threshold 0

      - name: 上传结构化结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-audit-results
          path: |
            data/audio-audit/audit_primary.json
            data/audio-audit/audit_junior.json
          if-no-files-found: ignore
