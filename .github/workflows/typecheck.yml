# 必然白屏错误卡口 —— 把类型检查从「本地靠人记得跑」上移到 CI。
#
# ★为什么需要★
# 2026-07-26 一天之内两次线上白屏,事后核实:这条流水线上**没有任何环节做类型检查**。
#   · `npm run build` = `vite build` = esbuild,只转译不检查类型,结构上拦不住作用域/时序错误;
#   · Vercel 无 buildCommand 配置,走的就是默认 `npm run build`;
#   · 仓库此前没有任何 workflow;
#   · 唯一自称在卡的 `npm run check:undef` 是本地脚本,且因 spawn 用 `npx.cmd` + shell:false
#     在 Windows 上恒 EINVAL、静默返回 0 处错误 —— 一道永远绿的门(已在 #243 修好)。
# 于是 `MistakeReviewGate.tsx` 里一处 TS2448(const 在声明前被使用)直接上了生产,
# 因该组件挂在 App 全局 → 全站白屏、首页都打不开。
#
# ★这道门卡什么★
# 只卡四类**必然在运行时抛 ReferenceError → 页面白屏**的错误:
#   TS2304 找不到名称 / TS2448 块级变量在声明前使用 / TS2454 变量在赋值前使用 / TS2729 属性在初始化前使用
# 它们不可能误报,基线恒为 0。判定逻辑全在 scripts/guard-undefined-identifiers.mjs,
# CI 只负责「保证它一定被执行」,不在这里另写一套规则(避免两处规则漂移)。
#
# ★这道门不卡什么★
# 整库还有约 219 条 stale `types.ts` 衍生的类型债(TS2345/2339/2352/2769/2322 等)。
# 那批**刻意不卡** —— 它们不会导致白屏,且清零是独立工程(baseline 增量检查另行排期)。
# 在这里顺手把它们纳入,只会让这道门永远红、然后被人绕过。
#
# ★这道门不替代真机验证★
# 它只能挡住「静态可判定」的 ReferenceError。跨模块/多文件改动合并前仍须
# `npm run build && npm run preview` 并用真实浏览器打开页面确认 Console 零红字。

name: typecheck

on:
  pull_request:
    branches: [main]
  # 直推 main / 合并后也跑一次,保证主干状态始终可见(分支保护只作用于 PR)
  push:
    branches: [main]

# 同一分支连续推送时取消上一次仍在跑的检查,省 Actions 额度
concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ══════════════════════════════════════════════════════════════════════════
# ⚠️ 这道门的两个静默失效点 —— 改动本文件前必读
#
# 1) **改 job 的 `name:` 会让分支保护静默失效。**
#    保护规则绑定的是下面那个 `no-whitescreen-guard` 字符串,不是 workflow 名。
#    改名之后规则还在,但指向一个不再存在的检查 → "没有必需的检查" → PR 一路畅通。
#
# 2) **PR 可以在自己分支里改弱或删掉本文件,门就没了。**
#    `pull_request` 事件跑的是 **PR 分支上的** workflow 文件(不是 main 上的)。
#    所以一个 PR 只要删掉 / 注释掉 / 把判定条件改宽,这次 CI 就不再拦它,
#    而分支保护看到的仍是"该检查已通过"。**这是 GitHub 的设计,不是 bug。**
#    → 因此:**任何改动 `.github/workflows/` 的 PR 必须人工看 diff**,不能只看绿灯。
#      若要根除,需在 Ruleset 里对该路径加 CODEOWNERS 审批(独立一项,未做)。
#
# 这两条都属于"绿灯了但其实没拦住"——与本仓库两次白屏同一形态(检查看起来在跑,
# 实际没跑/没拦),所以写在这里而不是只写在 PR 描述里:PR 描述会被划走,代码注释不会。
# ══════════════════════════════════════════════════════════════════════════

jobs:
  guard:
    # ⚠️ 见上方 ①:这个 name 就是分支保护里要勾选的 status check 名称,改名 = 保护静默失效
    name: no-whitescreen-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 与本地开发机及 Vercel 默认一致;仓库没有 engines/.nvmrc,故在此固定
          node-version: '24'
          cache: 'npm'

      - name: 安装依赖
        # 用 ci 而非 install:严格按 package-lock.json 还原,不改动锁文件
        run: npm ci

      - name: 必然白屏错误卡口
        # 脚本内部会自检 tsc 是否真的跑起来(spawn 失败/无退出码/退出码异常/有诊断却零输出
        # 一律判失败),并打印实际扫描行数,避免再次出现「空转却打勾」
        run: npm run check:undef
