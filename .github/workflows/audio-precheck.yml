name: audio-precheck

# 上线前置闸：PR 改到内容数据时，检查这批新内容的音频是否已生成。
#
# 为什么必须是 PR 闸而不是周巡检：周巡检的检出延迟最长 7 天，而这 7 天里新内容
# 在自动播路径上就是**静音**（speak.ts 非手势分支遇冷 key 只预热不出声）。
# 文档里的"合入前跑两步"会被跳过——尤其同时跑多条内容产线时。
#
# 不需要任何 secret：只对公开 CDN（audio.bigmooneducation.com）发 HEAD。
# 修复动作在作者本地跑（那里有 anon key），失败信息里给出可复制的命令。
#
# 覆盖范围（重要，别误读）：
#   ✅ 文件型内容源（primary/junior 的 JSON + junior 写死在组件里的 SENTENCE_PATTERNS）
#   ❌ **表源**（junior_vocab / junior_listening_exercises）—— DB 内容不在 diff 里，
#      用 SQL 加词不产生任何文件改动，按文件 diff 的闸门在结构上就管不到。
#      那部分由周巡检 audio-audit（--section junior --threshold 0）兜住，最长 7 天检出。
#      脚本会把跳过的表源逐条打印出来，不静默。
#
# 退出码：0 = 无缺口/未触及内容；1 = 有缺口（要作者本地 backfill 后重推）；
#         2 = 配置/覆盖率错误（新内容文件没在映射表分类）；3 = 金丝雀失败，本轮作废。

on:
  pull_request:
    paths:
      - 'src/data/**'   # 含 src/data/gaokao/** 与 src/data/gaokaoHub/**（senior 的 dataRoots）
      # junior 句型关的 4 组句型写死在这个组件里（junior.json 的 extraFiles）。
      # 它不在 src/data 下，不列出来就等于"改那 7 条文本可以绕过闸门"。
      - 'src/pages/juniorHub/JuniorHubStagePlay.tsx'
      # senior 句型关的文本同样写死在组件里（senior.json 的 extraFiles）
      - 'src/pages/gaokaoHub/GaokaoHubStagePlay.tsx'
      # 映射表/抽取逻辑本身改了也要重跑：档位改一个数，缺口集合就变了。
      - 'scripts/audio/audio-sources/*.json'
      - 'scripts/audio/pickers.mjs'
      - 'scripts/audio/extract.mjs'

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 base 分支来算 diff（只检查本 PR 改动到的内容文件）
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 只用 Node 内置模块（fs/path/crypto/fetch），不装依赖
      #
      # 两个 section 各跑一步、**都不加 continue-on-error**：
      # 任一有缺口就判红。分成两步是为了让红叉直接指出是哪个学段。
      - name: primary —— 只检查本 PR 改动到的内容文件
        run: |
          node scripts/audio/precheck-changed.mjs \
            --section primary \
            --base "origin/${{ github.base_ref }}"

      # junior 的表源（junior_vocab / junior_listening_exercises）在这里会被**显式跳过并打印**：
      # DB 内容不在 diff 里，按文件 diff 的闸门在结构上覆盖不到，那部分由周巡检兜。
      # 因此这一步同样**不需要任何凭据**（只对公开 CDN 发 HEAD）。
      - name: junior —— 只检查本 PR 改动到的内容文件
        if: always()   # primary 红了也要把 junior 的结论一起给出来，省一轮往返
        run: |
          node scripts/audio/precheck-changed.mjs \
            --section junior \
            --base "origin/${{ github.base_ref }}"

      # senior 与 junior 同：表源（junior_vocab 的高中行）在 PR 闸里跳过并打印，
      # 这一步同样零凭据。
      - name: senior —— 只检查本 PR 改动到的内容文件
        if: always()
        run: |
          node scripts/audio/precheck-changed.mjs             --section senior             --base "origin/${{ github.base_ref }}"

      - name: 上传缺口清单（便于本地直接喂给 backfill）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audio-precheck-gap-list
          path: |
            data/audio-audit/precheck_primary_list.csv
            data/audio-audit/precheck_junior_list.csv
            data/audio-audit/precheck_senior_list.csv
          if-no-files-found: ignore
