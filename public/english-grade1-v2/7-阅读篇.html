<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>阅读篇 · 英语小冒险</title>
<link rel="stylesheet" href="styles.css">
<style>
.level-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.level-tab {
  flex: 1;
  background: var(--c-cloud);
  border-radius: 100px;
  padding: 10px;
  font-size: 12px;
  text-align: center;
  font-weight: 600;
}
.level-tab.active { background: var(--gradient-sky); color: white; }

.reading-list { display: grid; gap: 8px; margin-bottom: 16px; }
.reading-item {
  background: white;
  border: 2px solid var(--c-soft);
  border-radius: 16px;
  padding: 14px 14px;
  display: flex;
  gap: 14px;
  align-items: center;
  cursor: pointer;
  text-align: left;
  width: 100%;
  font-family: inherit;
}
.reading-item:hover { border-color: var(--c-sky); transform: translateY(-2px); }
.reading-item .ri-emoji {
  font-size: 36px;
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  background: var(--c-cloud);
  border-radius: 12px;
  flex-shrink: 0;
}
.reading-item .ri-info { flex: 1; min-width: 0; color: var(--c-ink); }
.reading-item .ri-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.reading-item .ri-cn { font-size: 12px; color: rgba(45,48,71,0.6); }
.reading-item .ri-meta { font-size: 11px; color: var(--c-grape); margin-top: 4px; }
.reading-item.done { background: rgba(111,226,166,0.1); border-color: var(--c-mint); }
.reading-item.done::after { content: '✓'; color: var(--c-mint); font-size: 22px; font-weight: 700; }

.reading-screen { padding: 8px 4px; }
.reading-title-block { text-align: center; margin: 8px 0 16px; }
.reading-title-emoji { font-size: 60px; margin-bottom: 6px; }
.reading-title { font-size: 22px; font-weight: 700; color: var(--c-grape); margin-bottom: 4px; }
.reading-title-cn { font-size: 13px; color: rgba(45,48,71,0.6); }
.reading-text-block {
  background: var(--c-cloud);
  border-radius: 16px;
  padding: 18px 16px;
  margin-bottom: 12px;
  line-height: 1.85;
  font-size: 17px;
  font-weight: 500;
}
.reading-text-block p { margin-bottom: 12px; }
.reading-text-block p:last-child { margin-bottom: 0; }
.reading-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.reading-controls button {
  flex: 1;
  padding: 12px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 600;
}
.reading-controls .listen { background: var(--gradient-sky); color: white; }
.reading-controls .gist { background: var(--c-cloud); color: var(--c-ink); }

.gist-card {
  background: rgba(255, 203, 71, 0.15);
  border-left: 4px solid var(--c-sun);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 16px;
  display: none;
}
.gist-card.show { display: block; }
.gist-card strong { color: var(--c-coral); }

.questions-section {
  background: white;
  border-radius: 16px;
  padding: 16px 12px;
  margin-bottom: 12px;
}
.questions-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--c-grape);
  margin-bottom: 12px;
  text-align: center;
}
.q-item { margin-bottom: 16px; }
.q-item:last-child { margin-bottom: 0; }
.q-text { font-size: 14px; font-weight: 600; margin-bottom: 8px; padding-left: 4px; }
.q-options { display: grid; gap: 6px; }
.q-option {
  background: white;
  border: 2px solid var(--c-soft);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
  color: var(--c-ink);
  font-weight: 500;
}
.q-option:hover { border-color: var(--c-sky); }
.q-option .opt-letter {
  background: var(--c-cloud);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.q-option.correct { background: rgba(111,226,166,0.2); border-color: var(--c-mint); }
.q-option.wrong { background: rgba(255,126,126,0.15); border-color: var(--c-coral); }
.q-option.disabled { pointer-events: none; opacity: 0.6; }
.q-option.correct.disabled { opacity: 1; }

.btn-back-list { background: var(--c-cloud); padding: 10px; border-radius: 100px; font-size: 13px; width: 100%; }

.level-badge {
  display: inline-block;
  background: var(--c-soft);
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 700;
}
.level-badge.l1 { background: rgba(111,226,166,0.3); color: #2a7a4f; }
.level-badge.l2 { background: rgba(93,211,243,0.3); color: #1a6c8a; }
.level-badge.l3 { background: rgba(178,127,241,0.3); color: #5e2d92; }
</style>
</head>
<body>
<div id="app"></div>

<script src="data.js"></script>
<script src="reading-data.js"></script>
<script src="engine.js"></script>
<script>
const STATE = { level: 1, currentReading: null, answered: {} };

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  if (STATE.currentReading) {
    return renderReading(STATE.currentReading);
  }

  const screen = eg1.$(`
    <div class="screen">
      <div class="hud">
        <button class="hud-back" onclick="location.href='index.html'">←</button>
        <div style="flex:1;text-align:center;font-weight:700;font-size:16px;">📖 阅读篇</div>
        <div style="width:44px"></div>
      </div>

      <div class="level-tabs">
        <button class="level-tab ${STATE.level === 1 ? 'active' : ''}" data-l="1">入门 (10 篇)</button>
        <button class="level-tab ${STATE.level === 2 ? 'active' : ''}" data-l="2">进阶 (10 篇)</button>
        <button class="level-tab ${STATE.level === 3 ? 'active' : ''}" data-l="3">挑战 (10 篇)</button>
      </div>

      <div class="reading-list" id="list"></div>

      <div style="text-align:center;font-size:12px;color:rgba(45,48,71,0.5);padding:8px">
        💡 一年级孩子建议先把"入门"读完<br>
        每篇约 30-300 词，含中文大意和 3 道理解题
      </div>
    </div>
  `);
  app.appendChild(screen);

  screen.querySelectorAll('.level-tab').forEach(t => {
    t.onclick = () => { STATE.level = +t.dataset.l; render(); };
  });

  const list = screen.querySelector('#list');
  const items = READING.filter(r => r.level === STATE.level);
  items.forEach(r => {
    const status = eg1.srsStatus(r.id);
    const done = status === 'mastered' || status === 'learning';
    const card = eg1.$(`
      <button class="reading-item ${done ? 'done' : ''}">
        <div class="ri-emoji">${r.emoji}</div>
        <div class="ri-info">
          <div class="ri-title">${r.title}</div>
          <div class="ri-cn">${r.title_cn}</div>
          <div class="ri-meta">
            <span class="level-badge l${r.level}">L${r.level}</span>
            ${r.paragraphs.join(' ').split(/\s+/).length} 词 · ${r.questions.length} 题
          </div>
        </div>
      </button>
    `);
    card.onclick = () => { STATE.currentReading = r; render(); };
    list.appendChild(card);
  });
}

function renderReading(r) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  STATE.answered[r.id] = STATE.answered[r.id] || {};

  const screen = eg1.$(`
    <div class="screen">
      <div class="hud">
        <button class="hud-back" id="back">←</button>
        <div style="flex:1;text-align:center;font-weight:700;font-size:14px;">${r.title_cn}</div>
        <div style="width:44px"></div>
      </div>

      <div class="reading-screen">
        <div class="reading-title-block">
          <div class="reading-title-emoji">${r.emoji}</div>
          <div class="reading-title">${r.title}</div>
          <div class="reading-title-cn">${r.title_cn} · L${r.level}</div>
        </div>

        <div class="reading-text-block" id="text">
          ${r.paragraphs.map(p => `<p>${p}</p>`).join('')}
        </div>

        <div class="reading-controls">
          <button class="listen" id="listen">🔊 朗读全文</button>
          <button class="gist" id="gistBtn">💡 看大意</button>
        </div>

        <div class="gist-card" id="gist">
          <strong>大意：</strong> ${r.gist}
        </div>

        <div class="questions-section">
          <div class="questions-title">📝 读完答 ${r.questions.length} 道题</div>
          <div id="questions"></div>
        </div>

        <button class="btn-back-list" id="backList">← 返回阅读列表</button>
      </div>
    </div>
  `);
  app.appendChild(screen);

  screen.querySelector('#back').onclick = () => { STATE.currentReading = null; render(); };
  screen.querySelector('#backList').onclick = () => { STATE.currentReading = null; render(); };

  // 朗读
  let isReading = false;
  screen.querySelector('#listen').onclick = async () => {
    if (isReading) return;
    isReading = true;
    const sentences = r.paragraphs.join(' ').split(/(?<=[.!?])\s+/);
    for (const s of sentences) {
      eg1.speak(s, { rate: 0.8 });
      await new Promise(res => setTimeout(res, Math.max(1200, s.length * 80)));
    }
    isReading = false;
  };
  // 自动开始读一次
  setTimeout(() => screen.querySelector('#listen').click(), 500);

  // 大意切换
  const gistEl = screen.querySelector('#gist');
  screen.querySelector('#gistBtn').onclick = () => gistEl.classList.toggle('show');

  // 题目
  const qSection = screen.querySelector('#questions');
  r.questions.forEach((q, qi) => {
    const item = eg1.$(`
      <div class="q-item">
        <div class="q-text">${qi + 1}. ${q.q}</div>
        <div class="q-options"></div>
      </div>
    `);
    const optsEl = item.querySelector('.q-options');
    q.options.forEach((opt, oi) => {
      const btn = eg1.$(`
        <button class="q-option" data-i="${oi}">
          <span class="opt-letter">${'ABCD'[oi]}</span>
          <span>${opt}</span>
        </button>
      `);
      btn.onclick = (e) => {
        if (STATE.answered[r.id][qi] !== undefined) return;
        const isRight = oi === q.answer;
        // 锁定本题
        item.querySelectorAll('.q-option').forEach((b, bi) => {
          b.classList.add('disabled');
          if (bi === q.answer) b.classList.add('correct');
          else if (bi === oi && !isRight) b.classList.add('wrong');
        });
        STATE.answered[r.id][qi] = oi;
        eg1.recordAnswer(r.id + '_q' + qi, isRight, isRight ? 12 : 0);
        if (isRight) {
          eg1.burstStars(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
        }
        // 全部答完 → 把这篇文章标记为"读过"
        if (Object.keys(STATE.answered[r.id]).length === r.questions.length) {
          eg1.recordAnswer(r.id, true, 8);
        }
      };
      optsEl.appendChild(btn);
    });
    qSection.appendChild(item);
  });
}

render();
</script>
</body>
</html>
