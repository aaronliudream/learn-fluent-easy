  if (!text) return "none";
  // Pause any currently-playing audio element (without killing speechSynthesis
  // queue or cache). Avoids wiping out the next-segment prefetch.
  try { _ttsAudio?.pause(); _ttsAudio = null; } catch {}
  const cacheKey = `${voiceId}|${speed}|${text}`;
  /* tryPlayUrl resolves with:
     - "cloud"  : audio actually played to completion (or errored mid-play)
     - "fail"   : play() was rejected (autoplay blocked) or never started.
     onStart fires the moment the audio truly begins playing (the `playing`
     event), which lets the caller defer the typewriter/timer until then. */
  const tryPlayUrl = (url) => new Promise((resolve) => {
    const a = new Audio(url);
    a.preload = "auto";
    _ttsAudio = a;
    let started = false;
    let settled = false;
    const done = (status) => { if (!settled) { settled = true; resolve(status); } };
    a.addEventListener("playing", () => {
      started = true;
      try { onStart?.("cloud", isFinite(a.duration) ? a.duration : 0); } catch {}
    }, { once: true });
    a.onended = () => done("cloud");
    a.onerror = () => done(started ? "cloud" : "fail");
    // Play can reject (autoplay policy, codec error, transient). If it
    // rejects BEFORE 'playing' fires, we treat as fail so caller can fall
    // back to browser TTS instead of silently advancing.
    a.play().catch(() => done("fail"));
  });
  /* Browser SpeechSynthesis fallback. Resolves with "browser" or "none". */
  const browserSpeak = () => {
    if (!("speechSynthesis" in window)) return Promise.resolve("none");
    if (lang === "zh" && !detectZhVoice()) return Promise.resolve("none");
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === "zh" ? "zh-CN" : "en-US";
      u.rate = lang === "zh" ? 0.95 * speed : 0.92 * speed;
      let started = false;
      u.onstart = () => {
        started = true;
        try { onStart?.("browser", 0); } catch {}
      };
      u.onend = () => resolve(started ? "browser" : "none");
      u.onerror = () => resolve("none");
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
      // Safety: if the engine never fires onstart within 1.5s, treat as none.
      setTimeout(() => { if (!started) { try { window.speechSynthesis.cancel(); } catch {} resolve("none"); } }, 1500);
    });
  };
  if (TTS_CACHE.has(cacheKey)) {
    const r = await tryPlayUrl(TTS_CACHE.get(cacheKey));
    if (r === "fail") return browserSpeak();
    return r;
  }
  try {
    const r = await fetch(TTS_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": TTS_ANON_KEY,
        "Authorization": `Bearer ${TTS_ANON_KEY}`,
      },
      body: JSON.stringify({ text, voiceId, speed, format: "mp3" }),
    });
    if (!r.ok) throw new Error(`tts ${r.status}`);
    const j = await r.json();
    let url = j.audioUrl;
    if (!url && j.audioContent) url = `data:audio/mpeg;base64,${j.audioContent}`;
    if (!url) throw new Error("no audio");
    if (TTS_CACHE.size > 50) TTS_CACHE.clear();
    TTS_CACHE.set(cacheKey, url);
    const r2 = await tryPlayUrl(url);
    if (r2 === "fail") return browserSpeak();
    return r2;
  } catch (e) {
    return browserSpeak();
  }
}

/* Prefetch TTS audio for a segment without playing it.
   Used to warm the cache so the *next* segment plays without head-end delay. */
async function prefetchTTS(text, { voiceId = "shimmer", speed = 1.0 } = {}) {
  if (!text) return;
  const cacheKey = `${voiceId}|${speed}|${text}`;
  if (TTS_CACHE.has(cacheKey)) return;
  try {
    const r = await fetch(TTS_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": TTS_ANON_KEY,
        "Authorization": `Bearer ${TTS_ANON_KEY}`,
      },
      body: JSON.stringify({ text, voiceId, speed, format: "mp3" }),
    });
    if (!r.ok) return;
    const j = await r.json();
    let url = j.audioUrl;
    if (!url && j.audioContent) url = `data:audio/mpeg;base64,${j.audioContent}`;
    if (!url) return;
    if (TTS_CACHE.size > 50) TTS_CACHE.clear();
    TTS_CACHE.set(cacheKey, url);
  } catch {}
}

function mockEvaluateWriting({ prompt, response, expectedForm }) {
  const text = (response || "").toLowerCase().trim();
  if (text.length < 5) {
    return { ok: false, score: 0, message: "回答太短，至少写一句完整的话。" };
  }

  // Detect what subjunctive forms the student used
  const detected = [];
  if (/\bif\s+\w+\s+were\b/i.test(text))        detected.push({ form: "现在虚拟", marker: "If ... were" });
  if (/\bif\s+\w+\s+had\s+\w+/i.test(text))     detected.push({ form: "过去虚拟从句", marker: "If ... had + 过去分词" });
  if (/\bwould\s+have\s+\w+/i.test(text))       detected.push({ form: "过去虚拟主句", marker: "would have + 过去分词" });
  if (/\bwish\b.+\bhad\b/i.test(text))          detected.push({ form: "wish 过去后悔", marker: "wish ... had ..." });
  if (/\bi\s+wish\s+\w+\s+(were|could|knew|had)/i.test(text)) detected.push({ form: "wish 现在不满", marker: "I wish ..." });
  if (/^(were|had|should)\s+(i|you|he|she|it|we|they)\b/i.test(text)) detected.push({ form: "倒装", marker: "句首 Were/Had/Should" });

  // Detect common mistakes
  const issues = [];
  if (/\bif\s+\w+\s+was\s+\w+/i.test(text)) {
    issues.push({ severity: "major", span: "If ... was", msg: "❌ was → were。虚拟语气从句中 be 动词所有人称都用 were。" });
  }
  if (/\bif\s+\w+\s+(will|won't)\b/i.test(text)) {
    issues.push({ severity: "major", span: "If ... will", msg: "❌ if 从句不能用 will。主将从现——从句一般现在时。" });
  }
  if (/\bwish\s+(i|you|he|she|it|we|they)\s+(can|will|am|is|are|have|do)\b/i.test(text)) {
    issues.push({ severity: "moderate", span: "wish 后用现在式", msg: "⚠ wish 后要用过去式 (could/would/were/had)，表达远离现实。" });
  }
  if (/\bif\s+\w+\s+would\s+have\b/i.test(text)) {
    issues.push({ severity: "major", span: "If ... would have", msg: "❌ if 从句不能用 would have。从句直接 had + 过去分词，would 留给主句。" });
  }
  if (/\bhad\s+\w+\s+i\b/i.test(text) && !/\bhad\s+i\b/i.test(text)) {
    // not a real check — just an example
  }
  // would 后接 -ed 结尾 → 可能是错的（虚拟语气主句 would 后接动词原形）
  const wouldPlusEd = text.match(/\bwould\s+(\w+ed|went|came|got|did|had|was|were|knew|saw|heard|made)\b/i);
  if (wouldPlusEd && !/\bwould\s+have\b/i.test(text)) {
    issues.push({ severity: "moderate", span: `would ${wouldPlusEd[1]}`, msg: `⚠ would 后接动词原形 (例如 would tell/go/help)，不是过去式。如果要表过去虚拟，要用 would have + 过去分词。` });
  }

  // Compute score
  const subjUsed = detected.length > 0;
  const major = issues.filter(i => i.severity === "major").length;
  const moderate = issues.filter(i => i.severity === "moderate").length;

  let overall, score, headline;
  if (!subjUsed) {
    overall = "missing";  score = 2;
    headline = "句子完整，但**没用到虚拟语气**——题目要求虚拟语气句型。";
  } else if (major > 0) {
    overall = "errors";   score = 3;
    headline = `用了虚拟语气，但有 ${major} 处明显语法错。`;
  } else if (moderate > 0) {
    overall = "minor";    score = 4;
    headline = "虚拟语气用对了，有一些小问题可以更地道。";
  } else {
    overall = "great";    score = 5;
    headline = "✓ 虚拟语气用得很地道，没有发现错误。";
  }

  // Generate suggestion (if needed)
  let suggestion = null;
  if (overall !== "great") {
    suggestion = generateSuggestion({ original: response, expectedForm, detected });
  }

  // Naturalness mock score
  const naturalness = overall === "great" ? 8 + Math.floor(Math.random() * 2) :
                      overall === "minor" ? 6 + Math.floor(Math.random() * 2) :
                      4 + Math.floor(Math.random() * 2);

  return {
    ok: true,
    score, overall, headline,
    detected, issues,
    suggestion,
    naturalness,
    isMock: !AI_CONFIG.enabled,
  };
}

function generateSuggestion({ original, expectedForm, detected }) {
  // Simple template-based mock suggestion
  if (expectedForm && expectedForm.includes("If I were you")) {
    return "If I were you, I would tell him not to give up.";
  }
  if (expectedForm && expectedForm.includes("I wish I had")) {
    return "I wish I had studied harder back then.";
  }
  if (expectedForm && expectedForm.includes("If I had")) {
    return "If I had known, I would have helped.";
  }
  return null;
}

  } else if (/had/i.test(q)) {

  }
  return { answer, isMock: !AI_CONFIG.enabled };
}

const STORAGE_KEY = "pwl_v1";
const Storage = {
  available: (() => {
    try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
    catch (e) { return false; }
  })(),
  load() {
    if (!this.available) return null;
    try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  save(data) {
    if (!this.available) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  },
  reset() {
    if (!this.available) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  },
};

function useProgress() {
  const [progress, setProgress] = useState(() => {
    const stored = Storage.load();
    if (stored) return stored;
    return { ...DEFAULT_PROGRESS, firstSeen: new Date().toISOString() };
  });

  const update = (updater) => {
    setProgress(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      next.lastSeen = new Date().toISOString();
      Storage.save(next);
      return next;
    });
  };

  return [progress, {
    completeLevel(levelId, scoreData = {}) {
      update(p => ({
        ...p,
        levels: {
          ...p.levels,
          [levelId]: {
            completedAt: new Date().toISOString(),
            reviewsDone: 0,
            attempts: ((p.levels[levelId] && p.levels[levelId].attempts) || 0) + 1,
            ...scoreData,
          },
        },
      }));
    },
    recordMistake(levelId, mistake) {
      update(p => ({
        ...p,
        mistakes: [
          { ...mistake, levelId, date: new Date().toISOString() },
          ...p.mistakes,
        ].slice(0, 50),
        correctStreak: 0, // wrong answer breaks the streak
      }));
      try {
        window.parent && window.parent.postMessage({
          source: "subjunctive-lab",
          type: "attempt",
          payload: { isCorrect: false, levelId, mistake: { ...mistake, levelId } },
        }, "*");
      } catch (e) { /* noop */ }
    },
    completeReview(levelId) {
      update(p => ({
        ...p,
        levels: {
          ...p.levels,
          [levelId]: {
            ...p.levels[levelId],
            reviewsDone: ((p.levels[levelId] && p.levels[levelId].reviewsDone) || 0) + 1,
          },
        },
      }));
    },
    addStudyTime(minutes) {
      update(p => ({ ...p, totalMinutes: (p.totalMinutes || 0) + minutes }));
    },
    /* ─── Gamification actions ─── */
    awardXP(amount, reason) {
      update(p => ({ ...p, xp: (p.xp || 0) + amount }));
      if (window.__rewards) window.__rewards.xp(amount);
    },
    recordCorrect() {
      let unlocked = null;
      let leveled = false;
      update(p => {
        const newStreak = (p.correctStreak || 0) + 1;
        const newBest = Math.max(p.bestCorrectStreak || 0, newStreak);
        const newAch = [...(p.achievements || [])];
        if (!newAch.includes("first_correct")) { newAch.push("first_correct"); unlocked = "first_correct"; }
        else if (newStreak >= 5 && !newAch.includes("sharpshooter")) { newAch.push("sharpshooter"); unlocked = "sharpshooter"; }
        const oldLevel = xpToLevel(p.xp || 0);
        const newLevel = xpToLevel((p.xp || 0) + XP_REWARDS.exam_correct);
        if (newLevel > oldLevel) leveled = true;
        return { ...p, correctStreak: newStreak, bestCorrectStreak: newBest, xp: (p.xp || 0) + XP_REWARDS.exam_correct, achievements: newAch };
      });
      if (window.__rewards) {
        window.__rewards.xp(XP_REWARDS.exam_correct);
        if (unlocked) setTimeout(() => window.__rewards.achievement(unlocked), 800);
      }
    },
    awardFillCorrect() {
      update(p => ({ ...p, xp: (p.xp || 0) + XP_REWARDS.fill_correct, correctStreak: (p.correctStreak || 0) + 1 }));
      if (window.__rewards) window.__rewards.xp(XP_REWARDS.fill_correct);
    },
    awardReflexCard() {
      update(p => {
        const ach = [...(p.achievements || [])];
        if (!ach.includes("first_reflex")) {
          ach.push("first_reflex");
          if (window.__rewards) setTimeout(() => window.__rewards.achievement("first_reflex"), 600);
        }
        return { ...p, xp: (p.xp || 0) + XP_REWARDS.reflex_card, achievements: ach };
      });
      if (window.__rewards) window.__rewards.xp(XP_REWARDS.reflex_card);
    },
    completeLevelWithRewards(levelId, scoreData = {}) {
      let unlocked = null;
      update(p => {
        const ach = [...(p.achievements || [])];
        const justCompleted = !p.levels[levelId];
        if (justCompleted) {
          if (levelId === "1" && !ach.includes("first_level")) { ach.push("first_level"); unlocked = "first_level"; }
          if (levelId === "2" && !ach.includes("second_level")) { ach.push("second_level"); unlocked = "second_level"; }
          if (scoreData.score === scoreData.total && !ach.includes("perfect_lesson")) { ach.push("perfect_lesson"); unlocked = "perfect_lesson"; }
          // reflex_complete is awarded when reflex phase done
        }
        return {
          ...p,
          levels: { ...p.levels, [levelId]: { completedAt: new Date().toISOString(), reviewsDone: 0, attempts: ((p.levels[levelId] && p.levels[levelId].attempts) || 0) + 1, ...scoreData } },
          xp: (p.xp || 0) + XP_REWARDS.level_complete,
          achievements: ach,
        };
      });
      if (window.__rewards) {
        window.__rewards.confetti();
        window.__rewards.xp(XP_REWARDS.level_complete);
        if (unlocked) setTimeout(() => window.__rewards.achievement(unlocked), 1200);
      }
      try {
        window.parent && window.parent.postMessage({
          source: "subjunctive-lab",
          type: "level_complete",
          payload: { levelId, score: scoreData.score || 0, total: scoreData.total || 5 },
        }, "*");
      } catch (e) { /* noop */ }
    },
    unlockAchievement(id) {
      let actuallyUnlocked = false;
      update(p => {
        if ((p.achievements || []).includes(id)) return p;
        actuallyUnlocked = true;
        const ach = ACHIEVEMENTS.find(a => a.id === id);
        return { ...p, achievements: [...(p.achievements || []), id], xp: (p.xp || 0) + (ach ? ach.xp : 0) };
      });
      if (actuallyUnlocked && window.__rewards) {
        window.__rewards.achievement(id);
      }
    },
    updateDailyStreak() {
      update(p => {
        const today = new Date().toISOString().slice(0, 10);
        const last = p.dayStreak && p.dayStreak.lastActive;
        if (last === today) return p; // already counted today
        const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        const newCount = (last === yesterday) ? (p.dayStreak.count || 0) + 1 : 1;
        const ach = [...(p.achievements || [])];
        if (newCount >= 3 && !ach.includes("streak_3") && window.__rewards) { ach.push("streak_3"); setTimeout(() => window.__rewards.achievement("streak_3"), 500); }
        if (newCount >= 7 && !ach.includes("streak_7") && window.__rewards) { ach.push("streak_7"); setTimeout(() => window.__rewards.achievement("streak_7"), 500); }
        return { ...p, dayStreak: { count: newCount, lastActive: today }, achievements: ach };
      });
    },
    reset() {
      Storage.reset();
      setProgress({ ...DEFAULT_PROGRESS, firstSeen: new Date().toISOString() });
    },
  }];
}

function getDueReviews(progress) {
  const now = Date.now();
  const due = [];
  Object.entries(progress.levels || {}).forEach(([lvl, data]) => {
    if (!data.completedAt) return;
    const reviewsDone = data.reviewsDone || 0;
    if (reviewsDone >= REVIEW_INTERVALS.length) return;
    const completedTime = new Date(data.completedAt).getTime();
    const reviewDueAt = completedTime + REVIEW_INTERVALS[reviewsDone].hours * 3600 * 1000;
    if (reviewDueAt <= now) {
      due.push({ levelId: lvl, reviewIndex: reviewsDone, intervalLabel: REVIEW_INTERVALS[reviewsDone].cn, overdue: now - reviewDueAt });
    }
  });
  return due;
}

function getNextReview(progress) {
  const now = Date.now();
  let earliest = null;
  Object.entries(progress.levels || {}).forEach(([lvl, data]) => {
    if (!data.completedAt) return;
    const reviewsDone = data.reviewsDone || 0;
    if (reviewsDone >= REVIEW_INTERVALS.length) return;
    const completedTime = new Date(data.completedAt).getTime();
    const reviewDueAt = completedTime + REVIEW_INTERVALS[reviewsDone].hours * 3600 * 1000;
    if (reviewDueAt > now && (!earliest || reviewDueAt < earliest.dueAt)) {
      earliest = { levelId: lvl, dueAt: reviewDueAt, intervalLabel: REVIEW_INTERVALS[reviewsDone].cn };
    }
  });
  return earliest;
}

   LEVEL 5A · 现在条件 → 过去结果
   ═══════════════════════════════════════════════════════════════
   This is the REVERSE of L5 — and the hardest of all subjunctives:

   L5  (already built): 过去原因 → 现在结果
       If + had + V-ed,  would + V       (foundations: bad past → bad now)

   L5A (this level):    现在状态 → 过去结果
       If + 过去式,       would have + V-ed   (current state → missed past chance)

   Pattern violates intuitive time-order — a CURRENT lasting trait
   affecting a PAST specific action's outcome:

       If I were taller,           I would have made the team last year.
       (身高一直矮)                (去年没进队)

       If she weren't so shy,      she would have introduced herself.
       (一直害羞)                  (那次聚会没自我介绍)

       If I weren't afraid of heights,   I would have gone bungee jumping last summer.
       (一直恐高)                         (去年没去蹦极)

   Top mistakes — virtually all Chinese students make at least one:
     1. Reverse L5 formula:   If I had been taller, I would make the team.
                              (把状态写成过去完成 + 过去结果写成现在)
     2. Apply L4 (双虚拟过去): If I had been taller, I would have made it.

     3. Apply L1A (双过去式):  If I were taller, I would make the team.

     4. Wrong tense markers:  ignoring "last year/that time/then"
   ═══════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════
   LEVEL 2A · I wish 否定 · 后悔做过某事
   ═══════════════════════════════════════════════════════════════
   This level extends L3 (I wish I HAD done) with its NEGATIVE form
   (I wish I HADN'T done) — but more importantly, it trains the
   COUNTERFACTUAL FLIPPING that is the soul of "wish":

       现实做了某事  →  wish 没做  →  I wish I HADN'T done
       现实没做某事  →  wish 做了  →  I wish I HAD done

   L3 taught the form. L2A teaches the LOGIC — which Chinese
   students struggle with more than the grammar itself.

   Pedagogical focus — top mistakes:
     1. Tense fallback: writes 'I wish I didn't do that'
        (using simple-past negation, not wish-virtual)
     2. Direction confusion: 现实做了 but wish 写成 'I wish I had done'
        (forgot to flip — repeats reality instead of inverting it)
     3. Form confusion: 'I wish I haven't done' (使用现在完成代替过去完成)
     4. Wish vs hope: 'I hope I hadn't done' (用真希望表达虚拟后悔)
   ═══════════════════════════════════════════════════════════════ */

   This is the THIRD wish pattern — and the trickiest:

   pragmatic function of "would" that matters:
     I wish she WOULD listen.   →  暗含"她有能力听，但不愿意听"
     I wish it WOULD stop raining.  →  希望天气改变（外部环境）

   Crucial RULE: subject of wish + would CANNOT be I:
     ❌ I wish I would study harder.   (你想学就去学，不需要 wish)
     ✓  I wish my brother would help.  (希望别人改变)

   Top mistakes:
     1. Apply wish+past tense formula:  I wish he stopped → 形式对但语气不对
     2. Use will / shall:                I wish he will stop → 时态错
     3. Use could instead of would:      could = 能力 ≠ would = 意愿
     4. Use I as subject:                I wish I would do it
     5. Wrong placement:                 I wish to him to stop (滥用 to-不定式)
   ═══════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════
   LEVEL 1A · If I knew, I could... 完整型
   ═══════════════════════════════════════════════════════════════
   This level is the GENERALIZATION of L1 (If I were you).
   L1 only taught the special case (be verbs all → were).
   L1A teaches the universal formula for ANY verb:

       If + 主语 + 过去式动词,  主语 + would/could + 动原.
       If I knew the answer,    I would tell you.
       If I had more money,     I could buy a new phone.
       If she lived nearby,     she would visit us.

   Pedagogical focus — top mistakes by Chinese students:
     1. Wrong verb form for 3rd person:  If she knows  →  If she knew
     2. "would" stuck in the if-clause:  If I would know  →  If I knew
     3. Confusing real vs unreal:        If I have time, I will help.  vs.
                                         If I had time, I would help.
     4. Wrong tense (over-rotating):     If I had known  →  that's L4 (past unreal)
     5. could/would confusion:           "ability" → could · "willingness" → would
   ═══════════════════════════════════════════════════════════════ */

/* Total exam questions per built level — used for the X/Y ratio display */
function _levelTotal(builtAs) {
  if (!builtAs || builtAs === "interleaving") return 5;
  const lvlNum = parseInt(builtAs);
  if (isNaN(lvlNum)) return 5;
  return QUESTION_BANK.filter(q => q.lvl === lvlNum).length || 5;
}

/* Mastery calculation — returns rich object: {status, correct, total, errors} */
function getItemMastery(item, progress) {
  if (!item.builtAs) return { status: "in_dev",     correct: 0, total: 0, errors: 0 };

  if (item.builtAs === "exam_ref" || item.builtAs === "speed_drill" || item.builtAs === "writing" || item.builtAs === "diagnostic" || item.builtAs === "mock_exam" || item.builtAs === "detective") {
    return { status: "not_started", correct: 0, total: 0, errors: 0 };
  }

  if (item.builtAs === "interleaving") {
    const interMistakes = (progress.mistakes || []).filter(m => m.levelId === "interleaving");
    if (interMistakes.length === 0) return { status: "not_started", correct: 0, total: 0, errors: 0 };
    return { status: "familiar", correct: 0, total: 0, errors: interMistakes.length };
  }

  const total = _levelTotal(item.builtAs);
  const levelData = (progress.levels || {})[item.builtAs];
  const errors = (progress.mistakes || []).filter(m => m.levelId === item.builtAs).length;
  const cappedErrors = Math.min(errors, total);
  const correct = Math.max(0, total - cappedErrors);

  if (!levelData) return { status: "not_started", correct: 0, total, errors: 0 };

  // ─── Mastery Gate logic — use exam score if available ───
  const examScore = levelData.score;
  const examTotal = levelData.total || 5;
  if (examScore !== null && examScore !== undefined) {
    const passThreshold = Math.ceil(examTotal * 0.8);
    const softThreshold = Math.ceil(examTotal * 0.6);
    if (examScore >= passThreshold) return { status: "mastered",   correct: examScore, total: examTotal, errors: examTotal - examScore, examScore };
    if (examScore >= softThreshold) return { status: "soft_pass",  correct: examScore, total: examTotal, errors: examTotal - examScore, examScore };
    return                                 { status: "struggling", correct: examScore, total: examTotal, errors: examTotal - examScore, examScore };
  }

  // Fallback: legacy mistake-count logic
  if (errors === 0)  return { status: "mastered",   correct: total, total, errors: 0 };
  if (errors >= 3)   return { status: "struggling", correct, total, errors };
  return { status: "familiar", correct, total, errors };
}

const Progress = ({ value = 0, max = 100, className, indicatorClassName, showLabel = false, ...props }) => {
  const pct = Math.min(100, Math.max(0, (value / max) * 100));
  return (
    <div className={cn("relative h-2 w-full bg-warm/60 rounded-full overflow-hidden", className)} {...props}>
      <motion.div
        className={cn("h-full rounded-full bg-gradient-to-r from-mint to-amber", indicatorClassName)}
        initial={{ width: 0 }}
        animate={{ width: `${pct}%` }}
        transition={{ duration: 0.8, ease: [0.16, 1, 0.3, 1] }}
      />
      {showLabel && (
        <span className="absolute inset-0 flex items-center justify-center text-[10px] font-mono ink">{Math.round(pct)}%</span>
      )}
    </div>
  );
};

function ConfettiOverlay({ active }) {
  if (!active) return null;
  const colors = ["#7dd3c0", "#e8b56a", "#a78bfa", "#f87171", "#60a5fa"];
  const particles = Array.from({ length: 40 }, (_, i) => ({
    id: i,
    color: colors[Math.floor(Math.random() * colors.length)],
    x: (Math.random() - 0.5) * 600,
    y: -(Math.random() * 500 + 200),
    rot: Math.random() * 720 - 360,
    delay: Math.random() * 0.3,
    shape: Math.random() > 0.5 ? "50%" : "2px",
    size: 6 + Math.random() * 6,
  }));
  return (
    <div className="fixed inset-0 pointer-events-none z-[60]">
      {particles.map(p => (
        <motion.div
          key={p.id}
          className="absolute"
          style={{
            left: "50%",
            top: "50%",
            width: p.size,
            height: p.size,
            background: p.color,
            borderRadius: p.shape,

          animate={{ scale: [0, 1, 1, 0.8], x: p.x, y: p.y + 600, rotate: p.rot, opacity: [1, 1, 1, 0] }}
          transition={{ duration: 2, delay: p.delay, ease: "easeOut" }}

  );
}

/* ════════════════════════════════════════════════════════════════════
   THEME HOOK — light/dark with localStorage persistence
═══════════════════════════════════════════════════════════════════ */
function useTheme() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("pwl_theme") || "dark"; } catch { return "dark"; }
  });
  useEffect(() => {
    if (theme === "light") document.documentElement.classList.add("light-mode");
    else document.documentElement.classList.remove("light-mode");
    try { localStorage.setItem("pwl_theme", theme); } catch {}
  }, [theme]);
  return [theme, () => setTheme(t => t === "light" ? "dark" : "light")];
}

      steps: [
        { n: "1", label: "听情境 · 在心里用英文说出来" },
        { n: "2", label: "看标准答案 · 跟读两遍" },
        { n: "3", label: "做 5 道选择题 · 检验掌握" },
      ],
      reason: "我们不会让你猜、不会让你尴尬。每一步你都知道下一步是什么。",
      cta: "明白了，最后一项 →",
    },
    {
      icon: "✨",
      kicker: "3 / 3 · 你需要知道的",
      title: "今天大概 5 分钟",
      sub: null,
      promises: [
        "✓ 全程中文界面 · 不会有\u201C读不懂题\u201D",
        "✓ 答错有详细中文解析",
        "✓ 进度自动保存 · 关掉浏览器也在",
        "✓ 不需要背单词 · 用最常见的词",
      ],
      reason: "准备好了吗？深呼吸——我们开始。",
      cta: "✨ 开始 Level 1",
    },
  ];

  const s = steps[step];
  const next = () => {
    if (step < totalSteps - 1) setStep(step + 1);
    else {
      try { localStorage.setItem("pwl_onboarded", "1"); } catch {}
      onComplete();
    }
  };
  const skip = () => {
    try { localStorage.setItem("pwl_onboarded", "1"); } catch {}
    onComplete();
  };

  // Enter key advances to next step
  useEffect(() => {
    const handler = (e) => {
      if (e.key === "Enter") { next(); e.preventDefault(); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [step]);

  return (
    <section className="w-full max-w-md mx-auto">
      {/* Progress indicator */}
      <div className="flex gap-1.5 mb-10">
        {Array.from({ length: totalSteps }).map((_, i) => (
          <motion.div
            key={i}
            className="h-1 flex-1 rounded-full"
            initial={false}
            animate={{ background: i <= step ? "var(--mint)" : "var(--line)" }}
            transition={{ duration: 0.3 }}
          />
        ))}
      </div>

      <AnimatePresence mode="wait">
        <motion.div
          key={step}
          initial={{ opacity: 0, x: 30 }}
          animate={{ opacity: 1, x: 0 }}
          exit={{ opacity: 0, x: -30, transition: { duration: 0.15 } }}
          transition={spring}
          className="text-center"
        >
          <div className="text-6xl mb-6">{s.icon}</div>
          <div className="font-cn text-mint text-[10px] font-mono tracking-[0.3em] uppercase mb-3">{s.kicker}</div>
          <h1 className="font-cn-serif text-2xl sm:text-3xl ink leading-tight mb-4">{s.title}</h1>
          {s.sub && <p className="font-cn ink-dim text-sm leading-relaxed mb-6">{s.sub}</p>}

          {/* Step 2: 3-step process visualization */}
          {s.steps && (
            <div className="space-y-3 my-7 text-left">
              {s.steps.map((item, i) => (
                <motion.div
                  key={i}
                  initial={{ opacity: 0, x: -20 }}
                  animate={{ opacity: 1, x: 0 }}
                  transition={{ ...spring, delay: 0.1 + i * 0.1 }}
                  className="flex items-center gap-4 p-4 rounded-2xl bg-warm/40 border border-line-mid"
                >
                  <div className="w-10 h-10 shrink-0 rounded-full bg-mint-soft border border-mint/40 flex items-center justify-center font-display text-mint text-lg">
                    {item.n}
                  </div>
                  <div className="font-cn ink text-sm leading-snug text-left">{item.label}</div>
                </motion.div>
              ))}
            </div>
          )}

          {/* Step 3: promises */}
          {s.promises && (
            <div className="space-y-2 my-7 text-left bg-mint-soft/15 border border-mint/30 rounded-2xl p-5">
              {s.promises.map((p, i) => (
                <motion.div
                  key={i}
                  initial={{ opacity: 0, y: 10 }}
                  animate={{ opacity: 1, y: 0 }}
                  transition={{ ...spring, delay: 0.1 + i * 0.08 }}
                  className="font-cn ink text-sm leading-relaxed"
                >
                  {p}
                </motion.div>
              ))}
            </div>
          )}

          <p className="font-cn ink-faint text-xs italic mt-6 leading-relaxed">{s.reason}</p>

          <div className="mt-8 flex flex-col items-center gap-3">
            <motion.button
              onClick={next}
              whileHover={{ scale: 1.04 }}
              whileTap={{ scale: 0.96 }}
              transition={spring}
              className="font-cn btn-primary px-9 py-4 rounded-full text-base font-medium w-full sm:w-auto"
            >
              {s.cta}
            </motion.button>
            <button onClick={skip} className="font-cn ink-faint hover:ink text-xs underline-offset-4 hover:underline">
              跳过引导，直接开始
            </button>
          </div>
        </motion.div>
      </AnimatePresence>
    </section>
  );
}

/* ════════════════════════════════════════════════════════════════════
   SIDEBAR MENU — granular curriculum tree with mastery indicators
   Desktop: 48px collapsed strip, hover expands to 340px overlay
   Mobile:  hidden, opened via top-left button → full-screen drawer
═══════════════════════════════════════════════════════════════════ */
function SidebarMenu({ progress, onNavigate, currentStage }) {
  // Sidebar is now PERSISTENT (always visible on desktop) by default.
  // User can collapse for focus-mode; preference stored in localStorage.
  const [collapsed, setCollapsed] = useState(() => {
    try { return localStorage.getItem("pwl_sidebar_collapsed") === "1"; } catch { return false; }
  });
  const [mobileOpen, setMobileOpen] = useState(false);
  const [openCats, setOpenCats] = useState(() => new Set(CURRICULUM_TREE.map(c => c.id)));
  const [toast, setToast] = useState(null);

  const toggleCollapse = () => {
    const next = !collapsed;
    setCollapsed(next);
    try { localStorage.setItem("pwl_sidebar_collapsed", next ? "1" : "0"); } catch {}
  };

  const toggleCat = (id) => {
    setOpenCats(prev => {
      const n = new Set(prev);
      if (n.has(id)) n.delete(id);
      else n.add(id);
      return n;
    });
  };

  const handleClick = (item) => {
    if (!item.builtAs) {
      setToast(`${item.name} · 准备中——按路线图正在排期，请先把已开放的关卡练扎实`);
      setTimeout(() => setToast(null), 3500);
      return;
    }
    setMobileOpen(false);
    if (item.route === "L1") onNavigate(1);
    else if (item.route === "L2") onNavigate(12);
    else if (item.route === "L3") onNavigate(16);
    else if (item.route === "L4") onNavigate(17);
    else if (item.route === "L5") onNavigate(19);
    else if (item.route === "L6") onNavigate(21);
    else if (item.route === "L7") onNavigate(24);
    else if (item.route === "L8") onNavigate(25);
    else if (item.route === "L9") onNavigate(26);
    else if (item.route === "INTER") onNavigate(14);
    else if (item.route === "EXAM_REF") onNavigate(18);
    else if (item.route === "SPEED") onNavigate(20);
    else if (item.route === "WRITING") onNavigate(22);
    else if (item.route === "DIAGNOSTIC") onNavigate(23);
    else if (item.route === "MOCK") onNavigate(27);
    else if (item.route === "DETECTIVE") onNavigate(28);
    else if (item.route === "L1A") onNavigate(29);
    else if (item.route === "L2A") onNavigate(30);
    else if (item.route === "L2B") onNavigate(31);
    else if (item.route === "L5A") onNavigate(32);
  };

  const allItems = CURRICULUM_TREE.flatMap(c => c.children).filter(i => i.builtAs !== "exam_ref");
  const counts = { mastered: 0, familiar: 0, struggling: 0, not_started: 0, in_dev: 0 };
  allItems.forEach(item => { counts[getItemMastery(item, progress).status]++; });
  const total = allItems.length;
  // SIMPLIFIED: just two big buckets — "已会" (mastered) vs "其他"
  const learnedCount = counts.mastered;
  const masteredPct = Math.round((learnedCount / total) * 100);

  const isActiveItem = (item) => {
    if (item.route === "L1" && currentStage === 1) return true;
    if (item.route === "L1A" && currentStage === 29) return true;
    if (item.route === "L2A" && currentStage === 30) return true;
    if (item.route === "L2B" && currentStage === 31) return true;
    if (item.route === "L5A" && currentStage === 32) return true;
    if (item.route === "L2" && currentStage === 12) return true;
    if (item.route === "L3" && currentStage === 16) return true;
    if (item.route === "L4" && currentStage === 17) return true;
    if (item.route === "L5" && currentStage === 19) return true;
    if (item.route === "L6" && currentStage === 21) return true;
    if (item.route === "L7" && currentStage === 24) return true;
    if (item.route === "L8" && currentStage === 25) return true;
    if (item.route === "L9" && currentStage === 26) return true;
    if (item.route === "INTER" && currentStage === 14) return true;
    if (item.route === "EXAM_REF" && currentStage === 18) return true;
    if (item.route === "SPEED" && currentStage === 20) return true;
    if (item.route === "WRITING" && currentStage === 22) return true;
    if (item.route === "DIAGNOSTIC" && currentStage === 23) return true;
    if (item.route === "MOCK" && currentStage === 27) return true;
    if (item.route === "DETECTIVE" && currentStage === 28) return true;
    return false;
  };

  // ─── PANEL CONTENT ─── shared between desktop persistent and mobile drawer
  const Panel = (
    <div className="h-full overflow-y-auto bg-deep border-r border-line-mid">
      {/* HEADER — large, clear, dominant numbers */}
      <div className="p-5 border-b border-line">
        <div className="flex items-center justify-between mb-4">
          <div className="font-cn-serif text-lg ink">课程地图</div>
          <button
            onClick={toggleCollapse}
            className="hidden md:block ink-faint hover:ink text-sm font-mono px-2 py-1 rounded hover:bg-warm/40 transition"
            title="收起菜单"
            aria-label="收起菜单"
          >
            ◂
          </button>
        </div>

        {/* Big number — most important info first */}
        <div className="mb-3">
          <div className="flex items-baseline gap-2 mb-2">
            <span className="font-display text-5xl text-mint leading-none font-bold">{learnedCount}</span>
            <span className="font-cn ink-dim text-base">/ {total} 已掌握</span>
            <span className="font-mono text-mint text-base ml-auto">{masteredPct}%</span>
          </div>
          {/* Single-color progress bar — much cleaner than 5-color */}
          <div className="h-2.5 rounded-full overflow-hidden bg-warm/60">
            <div className="h-full bg-mint transition-all" style={{ width: `${masteredPct}%` }} />
          </div>
        </div>

        {/* Number breakdown — compact, no color overload */}
        <div className="flex items-center gap-4 mt-4 text-sm font-cn">
          <div>
            <span className="text-mint font-mono font-bold">{counts.mastered}</span>
            <span className="ink-dim ml-1">已会</span>
          </div>
          <div>
            <span className="ink font-mono font-bold">{counts.familiar + counts.struggling}</span>
            <span className="ink-dim ml-1">在学</span>
          </div>
          <div>
            <span className="ink-faint font-mono font-bold">{counts.not_started + counts.in_dev}</span>
            <span className="ink-faint ml-1">未学</span>
          </div>
        </div>
      </div>

      {/* CATEGORIES + ITEMS — bigger fonts, simpler colors */}
      <div className="py-2">
        {CURRICULUM_TREE.map(cat => {
          const isOpen = openCats.has(cat.id);
          const catCounts = cat.children.reduce((acc, item) => {
            acc[getItemMastery(item, progress).status]++;
            return acc;
          }, { mastered: 0, familiar: 0, struggling: 0, not_started: 0, in_dev: 0 });
          const catDone = catCounts.mastered;

          return (
            <div key={cat.id} className="mb-1">
              <button
                onClick={() => toggleCat(cat.id)}
                className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-warm/40 transition"
              >
                <span className="text-xl shrink-0">{cat.icon}</span>
                <span className="font-cn font-semibold text-base ink flex-1">{cat.name}</span>
                <span className="font-mono text-sm tabular-nums">
                  <span className="text-mint">{catDone}</span>
                  <span className="ink-faint">/{cat.children.length}</span>
                </span>
                <span className={`font-mono text-base ink-faint transition-transform ${isOpen ? "rotate-90" : ""}`}>›</span>
              </button>
              <AnimatePresence initial={false}>
                {isOpen && (
                  <motion.div
                    initial={{ height: 0, opacity: 0 }}
                    animate={{ height: "auto", opacity: 1 }}
                    exit={{ height: 0, opacity: 0 }}
                    transition={{ duration: 0.2 }}
                    className="overflow-hidden"
                  >
                    {cat.children.map(item => {
                      const m = getItemMastery(item, progress);
                      const isBuilt = !!item.builtAs;
                      const isActive = isActiveItem(item);
                      const isMastered = m.status === "mastered";
                      const isStarted  = m.status === "familiar" || m.status === "struggling";

                      // Right-side label — text-driven, color minimal
                      let rightLabel;
                      if (item.builtAs === "exam_ref")     rightLabel = <span className="text-amber font-medium">速查 →</span>;
                      else if (item.builtAs === "speed_drill") rightLabel = <span className="text-amber font-medium">⚡ 测试 →</span>;
                      else if (item.builtAs === "writing") rightLabel = <span className="text-mint font-medium">🤖 AI →</span>;
                      else if (item.builtAs === "mock_exam") {
                        let hasMock = false;
                        try { hasMock = !!localStorage.getItem("pwl_mock_exam"); } catch {}
                        rightLabel = hasMock ? <span className="text-mint">✓ 已模拟</span> : <span className="text-amber font-medium">📝 估分 →</span>;
                      }
                      else if (item.builtAs === "detective") rightLabel = <span className="text-mint font-medium">🕵️ 12 题 →</span>;
                      else if (item.builtAs === "diagnostic") {
                        // Check if user has done diagnostic
                        let hasDiag = false;
                        try { hasDiag = !!localStorage.getItem("pwl_diagnostic"); } catch {}
                        rightLabel = hasDiag ? <span className="text-mint">✓ 已诊断</span> : <span className="text-amber font-medium">📊 测一下 →</span>;
                      }
                      else if (m.status === "mastered")    rightLabel = <span className="text-mint">✓ 全对</span>;
                      else if (m.status === "familiar")    rightLabel = <span className="ink-dim">{m.errors} 题错过</span>;
                      else if (m.status === "struggling")  rightLabel = <span className="ink-dim">{m.errors} 题错过</span>;
                      else if (m.status === "not_started") rightLabel = <span className="ink-dim">可开始 →</span>;
                      else                                  rightLabel = <span className="ink-faint">准备中</span>;

                      // Single-color dot system: filled mint = mastered; ring mint = started; gray = not yet
                      let dot;
                      if (item.builtAs === "exam_ref")  dot = <span className="text-amber font-mono">📋</span>;
                      else if (item.builtAs === "speed_drill") dot = <span className="text-amber font-mono">⚡</span>;
                      else if (item.builtAs === "writing") dot = <span className="text-mint font-mono">🤖</span>;
                      else if (item.builtAs === "mock_exam") dot = <span className="text-amber font-mono">📝</span>;
                      else if (item.builtAs === "detective") dot = <span className="text-mint font-mono">🕵️</span>;
                      else if (item.builtAs === "diagnostic") dot = <span className="text-amber font-mono">📊</span>;
                      else if (isMastered)              dot = <span className="text-mint font-mono">●</span>;
                      else if (isStarted)               dot = <span className="text-mint font-mono opacity-50">◐</span>;
                      else if (m.status === "in_dev")   dot = <span className="ink-faint font-mono">◌</span>;
                      else                              dot = <span className="ink-faint font-mono">○</span>;

                      return (
                        <button
                          key={item.id}
                          onClick={() => handleClick(item)}
                          className={`w-full flex items-center gap-3 pl-10 pr-4 py-2.5 text-left transition ${
                            isActive ? "bg-mint-soft/25 border-l-2 border-mint" : "hover:bg-warm/30"
                          } ${!isBuilt ? "cursor-default" : "cursor-pointer"}`}
                        >
                          <span className="text-base shrink-0">{dot}</span>
                          <span className={`font-cn text-sm leading-snug flex-1 ${

/* ════════════════════════════════════════════════════════════════════
   SPEED DRILL — 速答模式
   The "2-second retrieval" feature. 10 random questions, 5s timer each,
   under-2s correct = ⚡ "秒杀". Defeats fluency illusion via raw speed pressure.
═══════════════════════════════════════════════════════════════════ */
function SpeedDrillScreen({ onBack, progress, progressActions }) {
  const [phase, setPhase] = useState("intro");        // intro | drill | results
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [timeLeft, setTimeLeft] = useState(5);
  const [startTime, setStartTime] = useState(0);
  const [feedback, setFeedback] = useState(null);

  const TIMER_S = 5;
  const FAST_S  = 2;

  const startDrill = () => {
    const pool = [...QUESTION_BANK];
    // Shuffle
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    // Normalize question shape: SpeedDrill expects opts as strings + an `answer` string.
    // QUESTION_BANK stores opts as {id,text,correct} objects, so flatten them here.
    const normalized = pool.slice(0, 10).map(q => {
      if (Array.isArray(q.opts) && q.opts.length && typeof q.opts[0] === "object") {
        const correctOpt = q.opts.find(o => o && o.correct);
        return {
          ...q,
          opts: q.opts.map(o => o.text),
          answer: correctOpt ? correctOpt.text : (q.answer ?? ""),
        };
      }
      return q;
    });
    setQuestions(normalized);
    setIdx(0);
    setAnswers([]);
    setTimeLeft(TIMER_S);
    setStartTime(Date.now());
    setFeedback(null);
    setPhase("drill");
  };

  const handleAnswer = (picked) => {
    if (feedback) return;
    const q = questions[idx];
    if (!q) return;
    const elapsed = (Date.now() - startTime) / 1000;
    const correct = picked === q.answer;
    let tier;
    if (!picked)                       tier = "timeout";
    else if (correct && elapsed < FAST_S) tier = "fast";
    else if (correct)                  tier = "slow";
    else                               tier = "wrong";

    setAnswers(prev => [...prev, { q, picked, correct, time: elapsed, tier }]);
    setFeedback({ tier, picked, correct, time: elapsed });

    setTimeout(() => {
      if (idx + 1 >= questions.length) {
        setPhase("results");
      } else {
        setIdx(idx + 1);
        setTimeLeft(TIMER_S);
        setStartTime(Date.now());
        setFeedback(null);
      }
    }, 1200);
  };

  // Timer tick
  useEffect(() => {
    if (phase !== "drill" || feedback) return;
    if (timeLeft <= 0) { handleAnswer(null); return; }
    const t = setTimeout(() => setTimeLeft(prev => Math.max(0, prev - 0.1)), 100);
    return () => clearTimeout(t);
  }, [phase, timeLeft, feedback]);

  // Keyboard 1-4 + Enter
  useEffect(() => {
    if (phase !== "drill" || feedback) return;
    const handler = (e) => {
      const q = questions[idx];
      if (!q) return;
      const num = parseInt(e.key);
      if (num >= 1 && num <= q.opts.length) {
        handleAnswer(q.opts[num - 1]);
        e.preventDefault();
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [phase, idx, feedback, questions, startTime]);

  // ─── INTRO ───
  if (phase === "intro") {
    return (
      <section className="w-full max-w-xl mx-auto">
        <div className="flex items-center gap-3 mb-6 flex-wrap">
          <button onClick={onBack} className="ink-faint hover:ink text-xs font-mono tracking-widest uppercase">← 返回</button>
        </div>

        <div className="text-center mb-8">
          <div className="text-6xl mb-4">⚡</div>
          <h2 className="font-cn-serif text-3xl ink mb-2">速答模式</h2>
          <p className="font-cn ink-dim text-sm">直接训练考试时的反射速度</p>
        </div>

        <div className="rounded-2xl border-2 border-amber/50 bg-amber/5 p-6 mb-6">
          <div className="font-cn font-medium text-amber text-sm mb-4 tracking-wider">⏱ 规则</div>
          <ul className="space-y-3 font-cn ink text-sm leading-relaxed">
            <li className="flex items-baseline gap-3">
              <span className="font-mono text-amber">·</span>
              <span>共 <span className="font-mono text-amber font-bold">10</span> 道题，从所有真题里随机抽</span>
            </li>
            <li className="flex items-baseline gap-3">
              <span className="font-mono text-amber">·</span>
              <span>每题最多 <span className="font-mono text-amber font-bold">5 秒</span></span>
            </li>
            <li className="flex items-baseline gap-3">
              <span className="font-mono text-mint">⚡</span>
              <span><span className="text-mint font-medium">2 秒内</span>答对 = <span className="text-mint font-bold">秒杀</span>（最高分）</span>
            </li>
            <li className="flex items-baseline gap-3">
              <span className="font-mono ink-dim">✓</span>
              <span>2-5 秒答对 = <span className="ink">正确</span></span>
            </li>
            <li className="flex items-baseline gap-3">
              <span className="font-mono text-rose">✗</span>
              <span>5 秒没答 / 答错 = <span className="text-rose">错过</span></span>
            </li>
          </ul>
        </div>

        <div className="rounded-xl bg-mint-soft/15 border border-mint/30 px-5 py-4 mb-6">
          <p className="font-cn text-sm ink leading-relaxed">
            <span className="font-bold text-mint">为什么要练速度？</span>
            考试时大脑没时间"思考"——只有"提取"。
            速答模式让你**强制激活** retrieval 反射，
            从「认得」推到「秒答」。
          </p>
        </div>

        <div className="text-center">
          <motion.button
            onClick={startDrill}
            whileHover={{ scale: 1.04 }}
            whileTap={{ scale: 0.96 }}
            transition={spring}
            className="font-cn px-10 py-4 rounded-full bg-amber text-bg-deep hover:bg-amber/90 transition text-base font-medium inline-flex items-center gap-3 shadow-2xl"
          >
            ⚡ 开始速答 · 10 题
          </motion.button>
          <p className="font-cn ink-faint text-xs mt-3">⌨ 准备好了吗？开始后键盘 1-4 选答案</p>
        </div>
      </section>
    );
  }

  // ─── DRILL ───
  if (phase === "drill") {
    const q = questions[idx];
    if (!q) return null;
    const timerPct = (timeLeft / TIMER_S) * 100;
    const timerColor = timeLeft > 3 ? "#7dd3c0" : timeLeft > 2 ? "#e8b56a" : "#e87a7a";

    return (
      <section className="w-full max-w-xl mx-auto">
        {/* Top bar — counter + timer */}
        <div className="flex items-center gap-4 mb-2">
          <div className="font-mono text-amber text-sm">
            <span className="font-bold">{idx + 1}</span>
            <span className="ink-faint">/ {questions.length}</span>
          </div>
          <div className="flex-1 h-2 rounded-full bg-warm/40 overflow-hidden">
            <motion.div
              className="h-full"
              animate={{ width: `${timerPct}%`, backgroundColor: timerColor }}
              transition={{ duration: 0.1 }}
            />
          </div>
          <div className="font-mono text-sm" style={{ color: timerColor, minWidth: 36, textAlign: 'right' }}>
            {timeLeft.toFixed(1)}s
          </div>
        </div>
        <div className="text-center mb-6">
          <span className="font-mono text-[10px] ink-faint tracking-widest uppercase">SPEED DRILL · L{q.lvl}</span>
        </div>

        {/* Question */}
        <div className="rounded-2xl bg-warm/30 border-2 border-line-mid p-6 mb-5 min-h-[140px] flex items-center">
          <p className="font-display text-xl sm:text-2xl ink leading-snug w-full text-center">
            {q.stem.split("___").map((part, i, arr) => (
              <React.Fragment key={i}>
                {part}
                {i < arr.length - 1 && (
                  <span className="inline-block min-w-[60px] mx-1 border-b-2 border-amber/70 align-baseline">&nbsp;</span>
                )}
              </React.Fragment>
            ))}
          </p>
        </div>

        {/* Options */}
        <div className="grid grid-cols-2 gap-3 mb-4">
          {q.opts.map((opt, i) => {
            let cls = "border-line-mid hover:border-mint hover:bg-mint-soft/20 ink";
            if (feedback) {
              if (opt === q.answer) cls = "border-mint bg-mint-soft/40 text-mint font-bold";
              else if (opt === feedback.picked && !feedback.correct) cls = "border-rose bg-rose/20 text-rose";
              else cls = "border-line-mid ink-faint opacity-50";
            }
            return (
              <button
                key={i}
                onClick={() => handleAnswer(opt)}
                disabled={!!feedback}
                className={`relative rounded-xl border-2 px-4 py-4 text-left transition text-base font-mono ${cls}`}
              >
                <span className="font-cn text-[10px] tracking-wider opacity-60 absolute top-2 left-3">{i + 1}</span>
                <span className="block pl-4">{opt}</span>
              </button>
            );
          })}
        </div>

        {/* Feedback flash */}
        <AnimatePresence>
          {feedback && (
            <motion.div
              initial={{ opacity: 0, y: 8 }}
              animate={{ opacity: 1, y: 0 }}
              exit={{ opacity: 0, y: -8 }}
              className="text-center py-3"
            >
              {feedback.tier === "fast" && (
                <div className="text-mint font-cn-serif text-xl font-bold">⚡ 秒杀！<span className="font-mono text-base ml-2">{feedback.time.toFixed(1)}s</span></div>
              )}
              {feedback.tier === "slow" && (
                <div className="font-cn-serif text-xl">✓ <span className="text-mint">正确</span><span className="ink-dim font-mono text-base ml-2">{feedback.time.toFixed(1)}s</span></div>
              )}
              {feedback.tier === "wrong" && (
                <div className="font-cn-serif text-xl"><span className="text-rose">✗ 错</span><span className="ink-dim text-sm ml-3">→ 正确：{q.answer}</span></div>
              )}
              {feedback.tier === "timeout" && (
                <div className="font-cn-serif text-xl"><span className="text-rose">⏰ 超时</span><span className="ink-dim text-sm ml-3">→ 正确：{q.answer}</span></div>
              )}
            </motion.div>
          )}
        </AnimatePresence>
      </section>
    );
  }

  // ─── RESULTS ───
  const correctCount = answers.filter(a => a.correct).length;
  const fastCount    = answers.filter(a => a.tier === "fast").length;
  const slowCount    = answers.filter(a => a.tier === "slow").length;
  const wrongCount   = answers.filter(a => a.tier === "wrong" || a.tier === "timeout").length;
  const avgTime      = answers.reduce((s, a) => s + a.time, 0) / answers.length;
  const score        = fastCount * 2 + slowCount * 1; // out of 20
  const wrongList    = answers.filter(a => !a.correct);

  let medal = "📊";
  let medalLabel = "继续努力";
  if (score >= 18)      { medal = "👑"; medalLabel = "速答之王"; }
  else if (score >= 14) { medal = "🥇"; medalLabel = "高速选手"; }
  else if (score >= 10) { medal = "🥈"; medalLabel = "稳健"; }
  else if (score >= 6)  { medal = "🥉"; medalLabel = "及格"; }

  return (
    <section className="w-full max-w-xl mx-auto">
      <div className="text-center mb-6">
        <div className="text-6xl mb-3">{medal}</div>
        <h2 className="font-cn-serif text-3xl ink mb-1">{medalLabel}</h2>
        <p className="font-cn ink-dim text-sm">速答完成</p>
      </div>

      {/* Big score */}
      <div className="rounded-3xl border-2 border-mint/40 bg-mint-soft/15 p-6 mb-5">
        <div className="text-center mb-5">
          <div className="font-mono text-mint text-sm tracking-widest mb-1">总分</div>
          <div className="flex items-baseline justify-center gap-2">
            <span className="font-display text-6xl text-mint font-bold leading-none">{score}</span>
            <span className="font-cn ink-dim text-lg">/ 20 分</span>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-3">
          <div className="text-center rounded-xl bg-deep/30 px-3 py-3">
            <div className="font-mono text-mint text-xl font-bold">{fastCount}</div>
            <div className="font-cn text-[10px] ink-dim mt-1">⚡ 秒杀</div>
          </div>
          <div className="text-center rounded-xl bg-deep/30 px-3 py-3">
            <div className="font-mono text-amber text-xl font-bold">{slowCount}</div>
            <div className="font-cn text-[10px] ink-dim mt-1">✓ 正确</div>
          </div>
          <div className="text-center rounded-xl bg-deep/30 px-3 py-3">
            <div className="font-mono text-rose text-xl font-bold">{wrongCount}</div>
            <div className="font-cn text-[10px] ink-dim mt-1">✗ 错过</div>
          </div>
        </div>
        <div className="text-center mt-4 pt-4 border-t border-line">
          <span className="font-cn ink-dim text-xs">平均反应时间</span>
          <span className="font-mono ink ml-2 font-bold">{avgTime.toFixed(2)}s</span>
        </div>
      </div>

      {/* Wrong list — review */}
      {wrongList.length > 0 && (
        <div className="rounded-2xl border border-rose/40 bg-rose/5 p-5 mb-5">
          <div className="font-cn text-rose text-xs font-mono tracking-wider mb-3">⚠ 错题回顾 · {wrongList.length} 题</div>
          <div className="space-y-3">
            {wrongList.map((a, i) => (
              <div key={i} className="border-b border-line last:border-0 pb-3 last:pb-0">
                <div className="font-mono text-sm ink leading-snug mb-2">
                  {a.q.stem.split("___").map((part, j, arr) => (
                    <React.Fragment key={j}>
                      {part}
                      {j < arr.length - 1 && <span className="text-mint font-bold mx-1">{a.q.answer}</span>}
                    </React.Fragment>
                  ))}
                </div>
                {a.q.why && <div className="font-cn text-xs ink-dim leading-relaxed">{a.q.why.slice(0, 100)}{a.q.why.length > 100 ? "..." : ""}</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Actions */}
      <div className="flex gap-3 justify-center flex-wrap">
        <motion.button
          onClick={startDrill}
          whileHover={{ scale: 1.04 }}
          whileTap={{ scale: 0.96 }}
          className="font-cn px-7 py-3.5 rounded-full bg-amber text-bg-deep hover:bg-amber/90 transition text-base font-medium inline-flex items-center gap-3"
        >
          ⚡ 再来 10 题
        </motion.button>
        <button onClick={onBack} className="font-cn px-6 py-3.5 rounded-full border border-line-mid ink hover:border-mint hover:bg-mint-soft/20 transition text-sm">
          ← 返回主页
        </button>
      </div>
    </section>
  );
}

/* ════════════════════════════════════════════════════════════════════
   WRITING PRACTICE — AI-evaluated subjunctive writing
   Demonstrates the AI client architecture. Mock now → real OpenAI later
   via single config flag (AI_CONFIG.enabled).
═══════════════════════════════════════════════════════════════════ */
const WRITING_PROMPTS = [
  { id: "w1", level: "1",
    context: "你的朋友考试没及格，给他写一句安慰的建议。",
    expectedForm: "If I were you, I would...",
    hint: "用 'If I were you, I would...' 给建议",
  },
  { id: "w2", level: "2",
    context: "你对自己的英语口语不满意，写一句感叹。",
    expectedForm: "I wish I + 过去式",
    hint: "用 'I wish I were/had/could/knew...' 表达对现状的不满",
  },
  { id: "w3", level: "3",
    context: "你回想去年没好好学英语，写一句后悔的话。",
    expectedForm: "I wish I had + 过去分词",
    hint: "用 'I wish I had + 过去分词' 表达过去后悔",
  },
  { id: "w4", level: "4",
    context: "你回忆当年考试前没复习导致的后果，写一个完整的虚拟过去条件句。",
    expectedForm: "If I had + 过去分词, I would have + 过去分词",
    hint: "用 'If I had ___, I would have ___' 表达过去虚拟",
  },
  { id: "w5", level: "5",
    context: "你回想当年的一个错误决定如何影响到现在的生活，用混合虚拟。",
    expectedForm: "If I had + 过去分词 (过去), I would + 动原 (现在)",
    hint: "过去原因 + 现在结果——主句要有 now",
  },
  { id: "w6", level: "6",
    context: "用倒装写一句感谢父母支持的话。",
    expectedForm: "Were it not for / Had it not been for",
    hint: "用 'Were it not for...' 或 'Had it not been for...'",
  },
];

function WritingPracticeScreen({ onBack }) {
  const [promptIdx, setPromptIdx] = useState(0);
  const [response, setResponse] = useState("");
  const [phase, setPhase] = useState("write"); // write | thinking | result
  const [evaluation, setEvaluation] = useState(null);

  const prompt = WRITING_PROMPTS[promptIdx];

  const submit = async () => {
    if (response.trim().length < 5) return;
    setPhase("thinking");
    const result = await aiClient.evaluateWriting({
      prompt: prompt.context,
      response: response.trim(),
      expectedForm: prompt.expectedForm,
    });
    setEvaluation(result);
    setPhase("result");
  };

  const nextPrompt = () => {
    setResponse("");
    setEvaluation(null);
    setPhase("write");
    setPromptIdx((promptIdx + 1) % WRITING_PROMPTS.length);
  };

  const retry = () => {
    setEvaluation(null);
    setPhase("write");
  };

  return (
    <section className="w-full max-w-2xl mx-auto pb-12">
      {/* Header */}
      <div className="flex items-center gap-3 mb-6 flex-wrap">
        <button onClick={onBack} className="ink-faint hover:ink text-xs font-mono tracking-widest uppercase">← 返回</button>
        <span className="ink-faint text-xs">·</span>
        <span className="font-cn text-xs ink-dim">AI 写作训练 · 第 {promptIdx + 1} / {WRITING_PROMPTS.length} 题</span>
      </div>

      <div className="text-center mb-6">
        <div className="text-5xl mb-3">🤖</div>
        <h2 className="font-cn-serif text-3xl ink mb-1">AI 写作训练</h2>
        <p className="font-cn ink-dim text-sm">写一段虚拟语气，AI 帮你打分</p>
      </div>

      {/* Mock notice — be honest about current state */}
      {!AI_CONFIG.enabled && (
        <div className="rounded-xl bg-amber/10 border border-amber/40 px-4 py-3 mb-5 text-center">
          <p className="font-cn text-xs ink-dim">
            <span className="text-amber">⚠ Demo 模式</span>·
            目前使用本地模拟评分。接入 OpenAI 后将替换为真实 AI 评分（约 1-2 秒）。
          </p>
        </div>
      )}

      {/* Prompt card */}
      <div className="rounded-2xl border-2 border-mint/40 bg-mint-soft/15 p-5 mb-5">
        <div className="flex items-baseline gap-2 mb-3">
          <span className="font-mono text-mint text-xs tracking-wider">题目 · L{prompt.level}</span>
          <span className="font-mono text-[10px] ink-faint">期待句型: {prompt.expectedForm}</span>
        </div>
        <p className="font-cn ink text-base leading-relaxed mb-2">{prompt.context}</p>
        <p className="font-cn ink-dim text-xs">💡 提示：{prompt.hint}</p>
      </div>

      {/* WRITE PHASE */}
      {phase === "write" && (
        <>
          <div className="mb-4">
            <div className="font-cn text-xs ink-dim mb-2 tracking-wider">你的回答（英文）</div>
            <textarea
              value={response}
              onChange={(e) => setResponse(e.target.value)}
              placeholder="在这里写出你的英文句子（可以写 1-3 句）..."
              autoFocus
              className="w-full bg-deep/40 border-2 border-line-mid focus:border-mint rounded-xl px-4 py-3 font-mono text-base ink outline-none transition resize-y min-h-[100px]"
              rows={4}
            />
            <div className="flex justify-between mt-2 text-xs">
              <span className="ink-faint font-mono">{response.length} 字符</span>
              {response.trim().length >= 5 && (
                <span className="text-mint font-cn">✓ 可以提交</span>
              )}
            </div>
          </div>

          <div className="flex gap-3 justify-center flex-wrap">
            <motion.button
              onClick={submit}
              disabled={response.trim().length < 5}
              whileHover={{ scale: response.trim().length >= 5 ? 1.04 : 1 }}
              whileTap={{ scale: 0.96 }}
              className="font-cn px-7 py-3.5 rounded-full bg-mint text-bg-deep hover:bg-mint/90 disabled:opacity-40 disabled:cursor-not-allowed transition text-base font-medium inline-flex items-center gap-2"
            >
              🤖 让 AI 评分
            </motion.button>
            <button
              onClick={nextPrompt}
              className="font-cn px-6 py-3.5 rounded-full border border-line-mid ink-dim hover:ink hover:border-mint transition text-sm"
            >
              换一题 →
            </button>
          </div>
        </>
      )}

      {/* THINKING PHASE */}
      {phase === "thinking" && (
        <div className="rounded-2xl border border-mint/30 bg-mint-soft/10 p-8 text-center">
          <div className="flex items-center justify-center gap-3 mb-3">
            <motion.div
              animate={{ rotate: 360 }}
              transition={{ duration: 1.5, repeat: Infinity, ease: "linear" }}
              className="text-2xl"
            >
              🤖
            </motion.div>
            <div className="font-cn ink text-base">AI 正在批改你的句子...</div>
          </div>
          <div className="flex justify-center gap-1.5 mt-4">
            {[0, 1, 2].map(i => (
              <motion.div
                key={i}
                className="w-2 h-2 rounded-full bg-mint"
                animate={{ opacity: [0.3, 1, 0.3] }}
                transition={{ duration: 1.2, repeat: Infinity, delay: i * 0.2 }}
              />
            ))}
          </div>
        </div>
      )}

      {/* RESULT PHASE */}
      {phase === "result" && evaluation && (
        <div className="space-y-4">
          {/* Show student's answer */}
          <div className="rounded-xl bg-warm/30 border border-line p-4">
            <div className="font-cn ink-dim text-xs mb-2 tracking-wider">你写的</div>
            <p className="font-mono text-base ink leading-relaxed">{response}</p>
          </div>

          {/* Score */}
          <div className="rounded-2xl border-2 border-mint/40 bg-mint-soft/15 p-5">
            <div className="flex items-center justify-between mb-3">
              <div className="font-cn text-mint text-xs tracking-wider">AI 评分</div>
              {evaluation.isMock && <div className="font-cn text-[10px] ink-faint italic">本地模拟</div>}
            </div>
            <div className="flex items-baseline gap-3 mb-3">
              <span className="font-display text-5xl text-mint font-bold leading-none">{evaluation.score}</span>
              <span className="font-cn ink-dim text-base">/ 5 分</span>
              <span className="ml-auto text-2xl">
                {evaluation.overall === "great" ? "🎉" : evaluation.overall === "minor" ? "👍" : evaluation.overall === "errors" ? "🔧" : "💡"}
              </span>
            </div>
            <p className="font-cn ink text-sm leading-relaxed">{evaluation.headline}</p>
          </div>

          {/* Detected forms */}
          {evaluation.detected && evaluation.detected.length > 0 && (
            <div className="rounded-xl bg-deep/30 border border-line p-4">
              <div className="font-cn text-xs ink-dim mb-2 tracking-wider">✓ 识别到的句型</div>
              <div className="flex flex-wrap gap-2">
                {evaluation.detected.map((d, i) => (
                  <span key={i} className="font-cn text-xs px-3 py-1 rounded-full bg-mint/20 text-mint border border-mint/40">
                    {d.form} <span className="font-mono opacity-60 ml-1">{d.marker}</span>
                  </span>
                ))}
              </div>
            </div>
          )}

          {/* Issues */}
          {evaluation.issues && evaluation.issues.length > 0 && (
            <div className="rounded-xl bg-rose/5 border border-rose/40 p-4">
              <div className="font-cn text-rose text-xs tracking-wider mb-3">⚠ 发现的问题（{evaluation.issues.length} 处）</div>
              <div className="space-y-3">
                {evaluation.issues.map((iss, i) => (
                  <div key={i} className="border-b border-line last:border-0 pb-2 last:pb-0">
                    <div className="font-mono text-sm text-rose mb-1">{iss.span}</div>
                    <p className="font-cn ink text-sm leading-relaxed">{iss.msg}</p>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Suggestion */}
          {evaluation.suggestion && (
            <div className="rounded-xl bg-amber/10 border border-amber/40 p-4">
              <div className="font-cn text-amber text-xs tracking-wider mb-2">💡 改进建议</div>
              <p className="font-mono text-base text-amber leading-relaxed">{evaluation.suggestion}</p>
            </div>
          )}

          {/* Naturalness meter */}
          {evaluation.naturalness !== undefined && (
            <div className="flex items-center gap-3 px-4 py-3 rounded-xl bg-warm/20 border border-line">
              <span className="font-cn ink-dim text-xs">自然度</span>
              <div className="flex-1 h-1.5 rounded-full bg-deep/40 overflow-hidden">
                <div
                  className="h-full bg-mint transition-all"
                  style={{ width: `${(evaluation.naturalness / 10) * 100}%` }}
                />
              </div>
              <span className="font-mono text-mint text-sm">{evaluation.naturalness}/10</span>
            </div>
          )}

          {/* Actions */}
          <div className="flex gap-3 justify-center flex-wrap pt-2">
            <button onClick={retry} className="font-cn px-6 py-3 rounded-full border border-line-mid ink hover:border-mint hover:bg-mint-soft/20 transition text-sm">
              ↻ 重写这题
            </button>
            <motion.button
              onClick={nextPrompt}
              whileHover={{ scale: 1.04 }}
              whileTap={{ scale: 0.96 }}
              className="font-cn px-6 py-3 rounded-full bg-mint text-bg-deep hover:bg-mint/90 transition text-sm font-medium"
            >
              下一题 →
            </motion.button>
          </div>
        </div>
      )}
    </section>
  );
}

/* ════════════════════════════════════════════════════════════════════
   DIAGNOSTIC PRE-TEST — 水平诊断
   12 questions across L1-L6. Shows STUDENT EXACTLY what they know,
   what they're shaky on, and what they don't know at all.
   Generates a personalized learning path. Stored in localStorage for
   the home CTA logic to consume.
═══════════════════════════════════════════════════════════════════ */
const DIAGNOSTIC_TEST = [
  { id: "d1", level: "1", point: "If I were you 给建议",
    stem: "If I ___ you, I would help him.",
    opts: ["was", "were", "am", "be"], answer: "were",
    why: "虚拟语气从句中 be 动词所有人称都用 were。" },
  { id: "d2", level: "2", point: "I wish + 过去式",
    stem: "I wish I ___ a piano at home.",
    opts: ["have", "had", "would have", "will have"], answer: "had",
    why: "wish 后接虚拟语气，对现在不满用过去式 had。" },
  { id: "d3", level: "4", point: "完整过去虚拟",
    stem: "If I ___ harder, I would have passed the exam.",
    opts: ["study", "studied", "had studied", "would study"], answer: "had studied",
    why: "过去虚拟 if 从句必须用 had + 过去分词。" },
];

/* ════════════════════════════════════════════════════════════════════

    why: "虚拟主句用 **would + 动词原形**。" },

  { id: "m7",  level: "4", point: "if 从句 had + 过去分词",
    stem: "If she ___ the warning, she wouldn't be in this situation now.",

    opts: ["be", "was", "should be", "were"], answer: "was",
    why: "suggest 表**暗示**（事实推断）→ **不虚拟**，用真实时态 was。" },
  { id: "m22", level: "9", point: "insist 坚持要求",
    stem: "Mom insisted that I ___ home before midnight every night.",
    opts: ["come", "came", "would come", "comes"], answer: "come",
    why: "insist 表\"坚持要求\" → 从句用 **(should) + 动原**。" },
  { id: "m23", level: "9", point: "It's high time + 过去式",
    stem: "It's high time we ___ taking the college entrance exam seriously.",
    opts: ["start", "started", "should start", "starting"], answer: "started",
    why: "It's high time 后面**直接用过去式**——固定虚拟用法。" },
  // 真假条件辨析（陷阱）(2)
  { id: "m24", level: "trap", point: "真实 vs 虚拟",
    stem: "If it ___ tomorrow, the picnic will be cancelled.",
    opts: ["rains", "rained", "would rain", "had rained"], answer: "rains",
    why: "**真实条件句**——明天可能下雨。从句用一般现在时（rains），主句用 will。" },
  { id: "m25", level: "trap", point: "真实 vs 虚拟",
    stem: "If I ___ rich, I'd travel around the world — but I'm not rich.",
    opts: ["am", "was", "were", "have been"], answer: "were",
    why: "明确说 \"but I'm not rich\" → **虚拟条件句**。be 动词用 were。" },
];

function MockExamScreen({ onBack }) {
  const [phase, setPhase] = useState("intro");
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [answers, setAnswers] = useState([]);
  const [startedAt, setStartedAt] = useState(null);

  const questions = MOCK_EXAM_QUESTIONS;
  const q = questions[idx];

  const submit = () => {
    if (!picked) return;
    const correct = picked === q.answer;
    const newAnswers = [...answers, { ...q, picked, correct }];
    setAnswers(newAnswers);
    setPicked(null);
    if (idx + 1 >= questions.length) {
      setPhase("result");
      try {
        localStorage.setItem("pwl_mock_exam", JSON.stringify({
          completedAt: Date.now(),
          duration: Math.round((Date.now() - startedAt) / 1000),
          totalCorrect: newAnswers.filter(a => a.correct).length,
          totalQs: newAnswers.length,
        }));
      } catch {}
    } else {
      setIdx(idx + 1);
    }
  };

  // Keyboard
  useEffect(() => {
    if (phase !== "exam") return;
    const handler = (e) => {
      const num = parseInt(e.key);
      if (num >= 1 && num <= q.opts.length) { setPicked(q.opts[num - 1]); e.preventDefault(); }
      else if (e.key === "Enter" && picked) { submit(); e.preventDefault(); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [phase, idx, picked, q]);

  if (phase === "intro") {
    return (
      <section className="w-full max-w-xl mx-auto">
        <div className="flex items-center gap-3 mb-6">
          <button onClick={onBack} className="ink-faint hover:ink text-xs font-mono tracking-widest uppercase">← 返回</button>
        </div>
        <div className="text-center mb-8">
          <div className="text-6xl mb-4">📝</div>
          <h2 className="font-cn-serif text-3xl ink mb-2">高考模拟卷</h2>
          <p className="font-cn ink-dim text-sm">25 题综合 · 涵盖全部 9 关考点 · 估高考分</p>
        </div>

        <div className="rounded-2xl border-2 border-amber/50 bg-amber/5 p-6 mb-6">
          <div className="font-cn font-medium text-amber text-sm mb-4 tracking-wider">📋 模拟卷规则</div>
          <ul className="space-y-3 font-cn ink text-sm leading-relaxed">
            <li className="flex items-baseline gap-3"><span className="font-mono text-amber">·</span><span>共 <span className="font-mono text-amber font-bold">25</span> 道题，<span className="font-mono text-amber font-bold">不限时</span></span></li>
            <li className="flex items-baseline gap-3"><span className="font-mono text-amber">·</span><span>覆盖 L1-L9 全部考点 + 真假条件辨析陷阱</span></li>
            <li className="flex items-baseline gap-3"><span className="font-mono text-amber">·</span><span>做完返回**估算高考虚拟语气得分** + 弱点分析</span></li>
            <li className="flex items-baseline gap-3"><span className="font-mono text-amber">·</span><span><span className="text-mint font-medium">22+ 答对 → 考点全覆盖，错题不留漏洞</span></span></li>
          </ul>
        </div>

        <div className="rounded-xl bg-mint-soft/15 border border-mint/30 px-5 py-4 mb-6">
          <p className="font-cn text-sm ink leading-relaxed">

          <p className="font-cn ink-faint text-xs mt-3">⌨ 键盘 1-4 选答案 · Enter 下一题</p>
        </div>
      </section>
    );
  }

  if (phase === "exam") {
    const progress = ((idx + 1) / questions.length) * 100;
    return (
      <section className="w-full max-w-xl mx-auto">
        <div className="flex items-center gap-4 mb-3">

        <div className="rounded-2xl bg-warm/30 border-2 border-line-mid p-6 mb-5 min-h-[120px] flex items-center">
          <p className="font-display text-xl sm:text-2xl ink leading-snug w-full text-center">
            {q.stem.split("___").map((part, i, arr) => (
              <React.Fragment key={i}>{part}{i < arr.length - 1 && <span className="inline-block min-w-[60px] mx-1 border-b-2 border-amber/70 align-baseline">&nbsp;</span>}</React.Fragment>
            ))}
          </p>
        </div>

        <div className="grid grid-cols-2 gap-3 mb-5">
          {q.opts.map((opt, i) => (
            <button key={i} onClick={() => setPicked(opt)} className={`relative rounded-xl border-2 px-4 py-4 text-left transition text-base font-mono ${picked === opt ? "border-amber bg-amber/15 text-amber font-bold" : "border-line-mid hover:border-amber/60 hover:bg-amber/5 ink"}`}>
              <span className="font-cn text-[10px] tracking-wider opacity-60 absolute top-2 left-3">{i + 1}</span>
              <span className="block pl-4">{opt}</span>
            </button>

        <div className="text-center">
          <motion.button onClick={submit} disabled={!picked} whileHover={{ scale: picked ? 1.04 : 1 }} whileTap={{ scale: 0.96 }} className="font-cn px-8 py-3 rounded-full bg-amber text-bg-deep hover:bg-amber/90 disabled:opacity-40 disabled:cursor-not-allowed transition text-base font-medium inline-flex items-center gap-2">
            {idx + 1 >= questions.length ? "完成模拟卷" : "下一题"} <span className="font-mono text-xs opacity-60">⏎</span>
          </motion.button>
        </div>
      </section>
    );
  }

  // RESULT
  const correctCount = answers.filter(a => a.correct).length;
  const pct = Math.round((correctCount / questions.length) * 100);
  // Estimated 高考 score (virtual subjunctive section is ~5 pts in 高考)
  const estimatedGaokao = Math.round(pct * 0.05) >= 4 ? "5 / 5 分" : pct >= 70 ? "3-4 / 5 分" : pct >= 50 ? "2-3 / 5 分" : "0-1 / 5 分";

  let medal, medalLabel, medalColor, certified = false;
  if (correctCount >= 22) { medal = "👑"; medalLabel = "考点全覆盖 · 错题清零";   medalColor = "text-mint";  certified = true; }
  else if (correctCount >= 19) { medal = "🥇"; medalLabel = "高分稳过";          medalColor = "text-mint"; }
  else if (correctCount >= 15) { medal = "🥈"; medalLabel = "良好 · 仍有漏洞";   medalColor = "text-amber"; }
  else if (correctCount >= 10) { medal = "🥉"; medalLabel = "及格 · 多关需重做"; medalColor = "text-amber"; }
  else                          { medal = "📈"; medalLabel = "需要系统重学";     medalColor = "text-rose"; }

  // Per-level breakdown
  const byLevel = {};
  for (const a of answers) {
    if (!byLevel[a.level]) byLevel[a.level] = { correct: 0, total: 0 };
    byLevel[a.level].total++;
    if (a.correct) byLevel[a.level].correct++;

  const levelMeta = {
    "1": "L1 If I were you", "2": "L2 I wish 现在", "3": "L3 I wish 过去",
    "4": "L4 If had..., would have", "5": "L5 混合虚拟", "6": "L6 倒装",
