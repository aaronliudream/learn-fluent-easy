name: audio-audit

# 小学音频巡检（Phase A 审计逻辑的固化版）。
#
# 为什么能放进 CI：这个任务**不需要任何凭据**——只对公开 CDN
# （audio.bigmooneducation.com）与生产站点发 HEAD，不碰 Supabase 密钥、不调 edge。
# 需要凭据的是"生成"（audio:backfill 要 anon key 调 tts edge），那一步不在这里跑。
#
# 退出码语义（脚本定义）：
#   0 = 三条前置断言通过且缺失 ≤ 阈值
#   1 = 前置通过但有真实缺口
#   3 = **前置断言未通过 → 本轮结论作废**（假200 回归 / 金丝雀空转 / 游离目录），
#       这类失败要按"检查器坏了"处理，而不是"内容缺音频"
#   2 = 配置/覆盖率错误（新内容源没分类等）

on:
  workflow_dispatch:
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）。私有仓库的 Actions 分钟数是计费的，
    # 单轮约 3400 次 HEAD、并发 8，实测 4~6 分钟，按周跑约 25 分钟/月。
    - cron: '0 2 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 巡检脚本只用 Node 内置模块（fs/path/crypto/fetch），不装依赖，省时间也省分钟数
      - name: 音频巡检（primary）
        run: node scripts/audio/audit-audio.mjs --section primary --threshold 0

      - name: 上传结构化结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-audit-primary
          path: data/audio-audit/audit_primary.json
