<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>听力篇 · 英语小冒险</title>
<link rel="stylesheet" href="styles.css">
<style>
.dialogue-stage {
  background: linear-gradient(135deg, rgba(93,211,243,0.08) 0%, rgba(178,127,241,0.08) 100%);
  border-radius: 24px;
  padding: 24px 16px;
  margin-bottom: 16px;
}
.dialogue-bubble {
  background: white;
  border-radius: 18px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-soft);
  position: relative;
  max-width: 88%;
  animation: bubbleIn 0.4s ease-out;
}
@keyframes bubbleIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.dialogue-bubble.right {
  margin-left: auto;
  background: var(--gradient-sky);
  color: white;
  animation-name: bubbleInRight;
}
@keyframes bubbleInRight {
  from { opacity: 0; transform: translateX(10px); }
  to { opacity: 1; transform: translateX(0); }
}
.dialogue-who {
  font-size: 12px;
  font-weight: 700;
  color: var(--c-coral);
  margin-bottom: 4px;
}
.dialogue-bubble.right .dialogue-who { color: rgba(255,255,255,0.9); }
.dialogue-text {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
}
.dialogue-bubble.hidden .dialogue-text {
  filter: blur(8px);
  opacity: 0.4;
}

.play-controls {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 16px 0;
}
.play-controls button {
  background: var(--gradient-warm);
  color: white;
  border-radius: 100px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
}
.play-controls button.secondary {
  background: var(--c-cloud);
  color: var(--c-ink);
}

.q-prompt {
  background: rgba(255,203,71,0.15);
  border-radius: 16px;
  padding: 14px;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--c-ink);
  margin-bottom: 14px;
}
.q-prompt::before { content: '❓ '; }

.locked-overlay {
  position: relative;
}
.locked-overlay::after {
  content: '👂 先听一遍再答题哦';
  position: absolute;
  inset: 0;
  background: rgba(253, 251, 246, 0.85);
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 600;
  color: rgba(45, 48, 71, 0.6);
}
</style>
</head>
<body>
<div id="app"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
const QUESTIONS_PER_ROUND = 6;
const STATE = {
  questions: [],
  idx: 0,
  score: 0,
  correct: 0,
  hasPlayed: false,    // 是否听过当前对话
  playing: false,
};

function startGame() {
  // 听力题数量较少（10 个），随机抽 6 个
  STATE.questions = eg1.pickRandom(DIALOGUES, Math.min(QUESTIONS_PER_ROUND, DIALOGUES.length));
  STATE.idx = 0;
  STATE.score = 0;
  STATE.correct = 0;
  renderQuestion();
}

function renderMenu() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(eg1.$(`
    <div class="screen">
      <div class="hud">
        <button class="hud-back" onclick="location.href='index.html'">←</button>
        <div style="flex:1;text-align:center;font-weight:700;font-size:16px;">🎧 听力篇</div>
        <div style="width:44px"></div>
      </div>
      <div style="text-align:center;padding:24px 16px">
        <div style="font-size:80px;margin-bottom:16px">🎧</div>
        <div style="font-size:22px;font-weight:700;margin-bottom:8px">听对话答问题</div>
        <div style="font-size:14px;color:rgba(45,48,71,0.6);margin-bottom:24px;line-height:1.5">
          会播放两个人的对话<br>
          听完后回答一个简单问题
        </div>
        <button class="btn-primary" id="start" style="width:100%">开始听力 · ${QUESTIONS_PER_ROUND} 段对话</button>
        <div style="font-size:12px;color:rgba(45,48,71,0.5);margin-top:16px">
          💡 听不懂可以点"再听一遍"<br>
          答错也没关系，多听几次就会啦
        </div>
      </div>
    </div>
  `));
  document.getElementById('start').onclick = startGame;
}

function renderQuestion() {
  if (STATE.idx >= STATE.questions.length) return renderResult();
  const d = STATE.questions[STATE.idx];
  STATE.hasPlayed = false;
  STATE.playing = false;

  const app = document.getElementById('app');
  const progress = (STATE.idx / STATE.questions.length) * 100;
  app.innerHTML = '';
  const screen = eg1.$(`
    <div class="screen">
      <div class="hud">
        <button class="hud-back" id="back">←</button>
        <div class="hud-progress"><div class="hud-progress-bar" style="width:${progress}%"></div></div>
        <div class="hud-score">${STATE.score}</div>
      </div>

      <div class="dialogue-stage">
        <div class="dialogue-bubble hidden" id="bubA">
          <div class="dialogue-who">${d.a.who}</div>
          <div class="dialogue-text">${d.a.text}</div>
        </div>
        <div class="dialogue-bubble right hidden" id="bubB">
          <div class="dialogue-who">${d.b.who}</div>
          <div class="dialogue-text">${d.b.text}</div>
        </div>
      </div>

      <div class="play-controls">
        <button id="play">▶️ 播放对话</button>
        <button class="secondary" id="replay" disabled>🔁 再听一遍</button>
      </div>

      <div class="q-prompt">${d.question}</div>

      <div class="options" id="opts"></div>
    </div>
  `);
  app.appendChild(screen);

  const bubA = screen.querySelector('#bubA');
  const bubB = screen.querySelector('#bubB');
  const playBtn = screen.querySelector('#play');
  const replayBtn = screen.querySelector('#replay');

  async function playDialogue() {
    if (STATE.playing) return;
    STATE.playing = true;
    playBtn.disabled = true;
    replayBtn.disabled = true;
    // A 说话
    bubA.classList.remove('hidden');
    eg1.speak(d.a.text, { rate: 0.8 });
    await wait(estimateDuration(d.a.text) + 400);
    // B 说话
    bubB.classList.remove('hidden');
    eg1.speak(d.b.text, { rate: 0.8 });
    await wait(estimateDuration(d.b.text) + 400);
    STATE.hasPlayed = true;
    STATE.playing = false;
    playBtn.disabled = true;
    playBtn.textContent = '✓ 已播放';
    replayBtn.disabled = false;
  }

  playBtn.onclick = playDialogue;
  replayBtn.onclick = async () => {
    if (STATE.playing) return;
    STATE.playing = true;
    replayBtn.disabled = true;
    bubA.style.opacity = '0.5';
    bubB.style.opacity = '0.5';
    eg1.speak(d.a.text, { rate: 0.75 });
    await wait(estimateDuration(d.a.text) + 400);
    eg1.speak(d.b.text, { rate: 0.75 });
    await wait(estimateDuration(d.b.text) + 400);
    bubA.style.opacity = '1';
    bubB.style.opacity = '1';
    STATE.playing = false;
    replayBtn.disabled = false;
  };

  // 选项区
  const optsEl = screen.querySelector('#opts');
  d.options.forEach((opt, i) => {
    const btn = eg1.$(`<button class="option-btn">${String.fromCharCode(65 + i)}. ${opt}</button>`);
    btn.onclick = (e) => {
      if (!STATE.hasPlayed) {
        // 还没听过 - 不让答
        eg1.showFeedback(false);
        playDialogue();
        return;
      }
      handleAnswer(btn, i === d.answer, d, e);
    };
    optsEl.appendChild(btn);
  });

  screen.querySelector('#back').onclick = () => {
    if (confirm('要返回吗？本轮成绩会保存。')) renderMenu();
  };

  // 自动播一次
  setTimeout(playDialogue, 400);
}

function handleAnswer(btn, isRight, d, e) {
  document.querySelectorAll('.option-btn').forEach(b => { if (b !== btn) b.disabled = true; });
  btn.classList.add(isRight ? 'correct' : 'wrong');
  if (!isRight) {
    document.querySelectorAll('.option-btn').forEach((b, i) => {
      if (i === d.answer) b.classList.add('correct');
    });
  }
  eg1.showFeedback(isRight);

  if (isRight) {
    STATE.score += 15;
    STATE.correct++;
    if (e) eg1.burstStars(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
  }
  eg1.recordAnswer(d.id, isRight, 15);

  setTimeout(() => {
    STATE.idx++;
    renderQuestion();
  }, isRight ? 1200 : 2000);
}

function renderResult() {
  const total = STATE.questions.length;
  const rate = STATE.correct / total;
  let medal = '🥉', title = '继续加油!';
  if (rate >= 1) { medal = '🏆'; title = '听力小达人!'; }
  else if (rate >= 0.75) { medal = '🥇'; title = '听力很好!'; }
  else if (rate >= 0.5) { medal = '🥈'; title = '不错哦~'; }

  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(eg1.$(`
    <div class="screen result-screen">
      <div class="result-medal">${medal}</div>
      <div class="result-title">${title}</div>
      <div class="result-stats">
        <div><div class="result-stat-num">${STATE.score}</div><div class="result-stat-label">本轮得分</div></div>
        <div><div class="result-stat-num">${STATE.correct}/${total}</div><div class="result-stat-label">答对</div></div>
      </div>
      <div class="result-actions">
        <button class="btn-primary" id="again">再来一轮</button>
        <button class="btn-secondary" onclick="location.href='index.html'">回首页</button>
      </div>
    </div>
  `));

  if (rate >= 0.75) {
    setTimeout(() => {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => eg1.burstStars(
          Math.random() * window.innerWidth,
          window.innerHeight / 3 + Math.random() * 200
        ), i * 200);
      }
    }, 400);
  }
  document.getElementById('again').onclick = startGame;
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function estimateDuration(text) {
  // 估算 TTS 朗读时长：英文每字约 80ms
  return Math.max(800, text.length * 75);
}

renderMenu();
</script>
</body>
</html>
