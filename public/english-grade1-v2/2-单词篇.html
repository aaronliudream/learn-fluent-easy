<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词篇 · 英语小冒险</title>
<link rel="stylesheet" href="styles.css">
<style>
.modes-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.mode-card {
  background: var(--c-cloud);
  border: 3px solid var(--c-soft);
  border-radius: 20px;
  padding: 20px 12px;
  text-align: center;
  cursor: pointer;
  width: 100%;
}
.mode-card[data-mode="picture"] { border-color: var(--c-sky); background: rgba(93, 211, 243, 0.12); }
.mode-card[data-mode="listen"]  { border-color: var(--c-grape); background: rgba(178, 127, 241, 0.12); }
.mode-card[data-mode="spell"]   { border-color: var(--c-coral); background: rgba(255, 126, 126, 0.12); }
.mode-card[data-mode="fill"]    { border-color: var(--c-mint); background: rgba(111, 226, 166, 0.12); }
.mode-card .mode-emoji { font-size: 40px; display: block; margin-bottom: 8px; }
.mode-card .mode-name { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.mode-card .mode-desc { font-size: 11px; color: rgba(45, 48, 71, 0.55); line-height: 1.3; }

.srs-info {
  background: linear-gradient(135deg, rgba(178,127,241,0.1) 0%, rgba(93,211,243,0.1) 100%);
  border-radius: 16px;
  padding: 14px 16px;
  font-size: 13px;
  margin-bottom: 12px;
  text-align: center;
  color: rgba(45, 48, 71, 0.7);
}
.srs-info strong { color: var(--c-grape); }

.combo-badge {
  position: fixed;
  top: 70px;
  right: 16px;
  background: var(--c-coral);
  color: white;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 100px;
  font-weight: 700;
  z-index: 10;
  animation: comboBounce 0.6s ease-out;
}
@keyframes comboBounce {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.sentence-card { font-size: 22px; line-height: 1.6; padding: 16px 12px; font-weight: 500; text-align: center; }
.sentence-blank { display: inline-block; min-width: 80px; border-bottom: 4px solid var(--c-coral); padding: 0 8px; margin: 0 4px; font-weight: 700; color: var(--c-coral); }
.sentence-cn { font-size: 14px; color: rgba(45,48,71,0.55); margin-top: 12px; font-weight: 400; }
</style>
</head>
<body>
<div id="app"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
const QUESTIONS_PER_ROUND = 8;
const STATE = { mode: null, questions: [], idx: 0, score: 0, correct: 0, combo: 0, maxCombo: 0 };

function renderMenu() {
  const due = eg1.srsDueItems(VOCAB.map(v => v.id)).length;
  const newCount = eg1.srsNewItems(VOCAB.map(v => v.id)).length;

  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(eg1.$(`
    <div class="screen">
      <div class="hud">
        <button class="hud-back" onclick="location.href='index.html'">←</button>
        <div style="flex:1;text-align:center;font-weight:700;font-size:16px;">📚 单词篇</div>
        <div style="width:44px"></div>
      </div>

      <div class="srs-info">
        ${due > 0 ? `今天有 <strong>${due}</strong> 个词需要复习` : `今天还有 <strong>${newCount}</strong> 个新词等你来学`}
      </div>

      <div class="modes-grid">
        <button class="mode-card" data-mode="picture">
          <span class="mode-emoji">🖼️</span>
          <div class="mode-name">看图认词</div>
          <div class="mode-desc">看图选英文</div>
        </button>
        <button class="mode-card" data-mode="listen">
          <span class="mode-emoji">🔊</span>
          <div class="mode-name">听音选词</div>
          <div class="mode-desc">听发音选拼写</div>
        </button>
        <button class="mode-card" data-mode="spell">
          <span class="mode-emoji">🔤</span>
          <div class="mode-name">拼写挑战</div>
          <div class="mode-desc">字母拼回单词</div>
        </button>
        <button class="mode-card" data-mode="fill">
          <span class="mode-emoji">📝</span>
          <div class="mode-name">句子填空</div>
          <div class="mode-desc">填正确单词</div>
        </button>
      </div>
      <div style="text-align:center;font-size:12px;color:rgba(45,48,71,0.5)">
        每轮 ${QUESTIONS_PER_ROUND} 题，自动按记忆曲线安排<br>
        建议先玩"看图"和"听音"，再玩"拼写"
      </div>
    </div>
  `));

  app.querySelectorAll('.mode-card').forEach(b => {
    b.onclick = () => startGame(b.dataset.mode);
  });
}

function startGame(mode) {
  STATE.mode = mode;
  STATE.questions = eg1.pickQuestions(VOCAB, QUESTIONS_PER_ROUND, 'id');
  if (STATE.questions.length === 0) {
    alert('词库出错了，请刷新');
    renderMenu();
    return;
  }
  // 不够 8 个，随便补
  while (STATE.questions.length < QUESTIONS_PER_ROUND) {
    const random = eg1.pickRandom(VOCAB, 1)[0];
    if (!STATE.questions.find(q => q.id === random.id)) STATE.questions.push(random);
  }
  STATE.idx = 0;
  STATE.score = 0;
  STATE.correct = 0;
  STATE.combo = 0;
  STATE.maxCombo = 0;
  renderQuestion();
}

function renderQuestion() {
  if (STATE.idx >= STATE.questions.length) return renderResult();
  const q = STATE.questions[STATE.idx];
  const app = document.getElementById('app');
  const progress = (STATE.idx / STATE.questions.length) * 100;

  app.innerHTML = '';
  const screen = eg1.$(`
    <div class="screen">
      <div class="hud">
        <button class="hud-back" id="back">←</button>
        <div class="hud-progress"><div class="hud-progress-bar" style="width:${progress}%"></div></div>
        <div class="hud-score">${STATE.score}</div>
      </div>
      <div id="qbody"></div>
    </div>
  `);
  app.appendChild(screen);

  document.querySelectorAll('.combo-badge').forEach(el => el.remove());
  if (STATE.combo >= 2) {
    document.body.appendChild(eg1.$(`<div class="combo-badge">🔥 连对 ${STATE.combo}</div>`));
  }

  screen.querySelector('#back').onclick = () => {
    if (confirm('要返回吗？本轮成绩会保存。')) {
      document.querySelectorAll('.combo-badge').forEach(el => el.remove());
      renderMenu();
    }
  };

  const body = screen.querySelector('#qbody');
  if (STATE.mode === 'picture') renderPictureQ(body, q);
  else if (STATE.mode === 'listen') renderListenQ(body, q);
  else if (STATE.mode === 'spell') renderSpellQ(body, q);
  else if (STATE.mode === 'fill') renderFillQ(body, q);
}

// ============== 看图认词 ==============
function renderPictureQ(container, q) {
  const wrongs = eg1.pickRandom(VOCAB.filter(v => v.word !== q.word), 3);
  const options = eg1.shuffle([q, ...wrongs]);

  container.appendChild(eg1.$(`
    <div class="question-card">
      <div class="question-emoji">${q.emoji}</div>
      <div class="question-prompt">这是什么？</div>
      <div class="question-prompt-cn">选择正确的英文单词</div>
    </div>
    <div class="options" id="opts"></div>
  `));
  const opts = container.querySelector('#opts');
  options.forEach(opt => {
    const btn = eg1.$(`<button class="option-btn">${opt.word}</button>`);
    btn.onclick = (e) => handleAnswer(btn, opt.word === q.word, q, e);
    opts.appendChild(btn);
  });
}

// ============== 听音选词 ==============
function renderListenQ(container, q) {
  const wrongs = eg1.pickRandom(VOCAB.filter(v => v.word !== q.word), 3);
  const options = eg1.shuffle([q, ...wrongs]);

  container.appendChild(eg1.$(`
    <div class="question-card">
      <button class="speaker-btn" id="spk">🔊</button>
      <div class="question-prompt">听一听，选拼写</div>
      <div class="question-prompt-cn">点喇叭可以再听一遍</div>
    </div>
    <div class="options" id="opts"></div>
  `));
  setTimeout(() => eg1.speak(q.word), 300);
  container.querySelector('#spk').onclick = () => eg1.speak(q.word);

  const opts = container.querySelector('#opts');
  options.forEach(opt => {
    const btn = eg1.$(`<button class="option-btn">${opt.word}</button>`);
    btn.onclick = (e) => handleAnswer(btn, opt.word === q.word, q, e);
    opts.appendChild(btn);
  });
}

// ============== 拼写挑战 ==============
function renderSpellQ(container, q) {
  const word = q.word.toLowerCase();
  const len = word.length;
  const extras = ['a','e','i','o','u','t','s','n']
    .filter(l => !word.includes(l))
    .slice(0, Math.max(0, Math.min(2, 7 - len)));
  const letters = eg1.shuffle(word.split('').concat(extras));

  container.appendChild(eg1.$(`
    <div class="question-card">
      <div class="question-emoji" style="font-size:72px">${q.emoji}</div>
      <div style="font-size:24px;font-weight:700;color:var(--c-grape);margin-bottom:8px">${q.cn}</div>
      <div class="question-prompt-cn">用字母拼出英文</div>
      <div class="spell-slots" id="slots"></div>
      <div class="spell-letters" id="letters"></div>
      <div class="spell-actions">
        <button id="undo">⌫ 删除</button>
        <button id="hear">🔊 听一下</button>
      </div>
    </div>
  `));

  const slotsEl = container.querySelector('#slots');
  const lettersEl = container.querySelector('#letters');
  const slots = [];
  for (let i = 0; i < len; i++) {
    const slot = eg1.$(`<div class="spell-slot"></div>`);
    slotsEl.appendChild(slot);
    slots.push(slot);
  }
  const letterBtns = [];
  letters.forEach((l, i) => {
    const btn = eg1.$(`<button class="letter-btn" data-bidx="${i}">${l}</button>`);
    lettersEl.appendChild(btn);
    letterBtns.push(btn);
  });

  const filled = [];
  function refresh() {
    slots.forEach((s, i) => {
      if (filled[i]) { s.textContent = filled[i].letter; s.classList.add('filled'); }
      else { s.textContent = ''; s.classList.remove('filled'); }
    });
    letterBtns.forEach((b, i) => {
      b.disabled = !!filled.find(f => f.btnIdx === i);
    });
  }

  letterBtns.forEach((btn, bidx) => {
    btn.onclick = () => {
      if (filled.length >= len) return;
      filled.push({ letter: btn.textContent, btnIdx: bidx });
      refresh();
      if (filled.length === len) {
        setTimeout(() => {
          const guess = filled.map(f => f.letter).join('');
          const isRight = guess === word;
          slots.forEach(s => {
            s.style.transition = 'all 0.3s';
            if (isRight) {
              s.style.background = 'var(--gradient-success)';
              s.style.color = 'white';
              s.style.borderColor = 'var(--c-mint)';
            } else {
              s.style.background = 'rgba(255,126,126,0.2)';
              s.style.borderColor = 'var(--c-coral)';
            }
          });
          const rect = slotsEl.getBoundingClientRect();
          handleAnswer(null, isRight, q, {
            clientX: rect.left + rect.width / 2,
            clientY: rect.top + rect.height / 2,
          });
        }, 300);
      }
    };
  });
  container.querySelector('#undo').onclick = () => { if (filled.length) { filled.pop(); refresh(); }};
  container.querySelector('#hear').onclick = () => eg1.speak(q.word);
}

// ============== 句子填空 ==============
function renderFillQ(container, q) {
  // 找一个含此词的句子，没有就动态构造
  const sent = q.sent || makeSimpleSentence(q);
  const sentenceHtml = sent.en.replace('___', `<span class="sentence-blank">?</span>`);
  const wrongs = eg1.pickRandom(VOCAB.filter(v => v.word !== q.word), 3);
  const options = eg1.shuffle([q, ...wrongs]);

  container.appendChild(eg1.$(`
    <div class="question-card">
      <div class="question-emoji" style="font-size:72px">${q.emoji}</div>
      <div class="sentence-card">
        ${sentenceHtml}
        <div class="sentence-cn">${sent.cn}</div>
      </div>
    </div>
    <div class="options" id="opts"></div>
  `));
  setTimeout(() => eg1.speak(sent.en.replace('___', q.word)), 400);

  const opts = container.querySelector('#opts');
  options.forEach(opt => {
    const btn = eg1.$(`<button class="option-btn">${opt.word}</button>`);
    btn.onclick = (e) => {
      const right = opt.word === q.word;
      if (right) {
        const blank = container.querySelector('.sentence-blank');
        if (blank) {
          blank.textContent = opt.word;
          blank.style.color = 'var(--c-mint)';
          blank.style.borderColor = 'var(--c-mint)';
        }
      }
      handleAnswer(btn, right, q, e);
    };
    opts.appendChild(btn);
  });
}

function makeSimpleSentence(q) {
  // 没预设句子时，根据词性构造一个
  return { en: `I see a ___.`, cn: `我看见一个${q.cn}。` };
}

// ============== 通用答题处理 ==============
function handleAnswer(btn, isRight, q, e) {
  document.querySelectorAll('.option-btn, .letter-btn, .speaker-btn').forEach(b => {
    if (b !== btn) b.disabled = true;
  });
  if (btn) btn.classList.add(isRight ? 'correct' : 'wrong');
  if (!isRight) {
    document.querySelectorAll('.option-btn').forEach(b => {
      if (b.textContent.trim() === q.word) b.classList.add('correct');
    });
  }
  eg1.speak(q.word);
  eg1.showFeedback(isRight);

  let pts = 10;
  if (isRight) {
    STATE.combo++;
    STATE.maxCombo = Math.max(STATE.maxCombo, STATE.combo);
    if (STATE.combo >= 5) pts = 25;
    else if (STATE.combo >= 3) pts = 18;
    STATE.score += pts;
    STATE.correct++;
    if (e) eg1.burstStars(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
  } else {
    STATE.combo = 0;
  }

  eg1.recordAnswer(q.id, isRight, pts);
  document.querySelectorAll('.combo-badge').forEach(el => el.remove());

  setTimeout(() => {
    STATE.idx++;
    renderQuestion();
  }, isRight ? 1100 : 1800);
}

// ============== 结算页 ==============
function renderResult() {
  const total = STATE.questions.length;
  const rate = STATE.correct / total;
  let medal = '🥉', title = '继续加油!';
  if (rate >= 1) { medal = '🏆'; title = '全部答对！'; }
  else if (rate >= 0.75) { medal = '🥇'; title = '你真棒！'; }
  else if (rate >= 0.5) { medal = '🥈'; title = '不错哦~'; }

  const app = document.getElementById('app');
  app.innerHTML = '';
  document.querySelectorAll('.combo-badge, .feedback').forEach(el => el.remove());

  app.appendChild(eg1.$(`
    <div class="screen result-screen">
      <div class="result-medal">${medal}</div>
      <div class="result-title">${title}</div>
      <div class="result-stats">
        <div><div class="result-stat-num">${STATE.score}</div><div class="result-stat-label">本轮得分</div></div>
        <div><div class="result-stat-num">${STATE.correct}/${total}</div><div class="result-stat-label">答对</div></div>
        <div><div class="result-stat-num">🔥${STATE.maxCombo}</div><div class="result-stat-label">最高连对</div></div>
      </div>
      <div class="result-actions">
        <button class="btn-primary" id="again">再来一轮</button>
        <button class="btn-secondary" onclick="location.href='index.html'">回首页</button>
      </div>
    </div>
  `));

  if (rate >= 0.75) {
    setTimeout(() => {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => eg1.burstStars(
          Math.random() * window.innerWidth,
          window.innerHeight / 3 + Math.random() * 200
        ), i * 200);
      }
    }, 400);
  }
  document.getElementById('again').onclick = () => startGame(STATE.mode);
}

renderMenu();
</script>
</body>
</html>
